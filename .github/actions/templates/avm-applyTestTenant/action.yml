name: "Apply frozen test tenant"
description: >-
  Apply the Tools-resolved execution context without rereading tenant-selection variables.
  BAMI uses its Bicep identity in the existing avm-validation environment; its federated
  credential must be provisioned separately before enabling the central canary.
  Legacy credential exceptions and the legacy CI Key Vault are not supported in BAMI.
  Deployment rejects inherited CI fixture references outside the selected context
  and unscoped directory identity fixtures before Azure login.

inputs:
  testTenant:
    description: "The frozen legacy or bami result from the Tools resolver."
    required: true
  settingsJson:
    description: "The frozen settings-json result from the Tools resolver."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Apply frozen test context"
      shell: pwsh
      env:
        AVM_TEST_TENANT: ${{ inputs.testTenant }}
        AVM_TEST_TENANT_SETTINGS: ${{ inputs.settingsJson }}
      run: |
        if ($env:AVM_TEST_TENANT -cnotin @('legacy', 'bami')) {
          throw 'The frozen test tenant must be exactly legacy or bami.'
        }
        $settings = ConvertFrom-Json -InputObject $env:AVM_TEST_TENANT_SETTINGS -AsHashtable -NoEnumerate -ErrorAction Stop
        if ($settings -isnot [System.Collections.IDictionary]) {
          throw 'The frozen test tenant settings must be an object.'
        }

        $values = [ordered]@{ AVM_TEST_TENANT = $env:AVM_TEST_TENANT }
        if ($env:AVM_TEST_TENANT -ceq 'legacy') {
          if ($settings.Count -ne 0) {
            throw 'The legacy test tenant must not contain BAMI settings.'
          }
        } else {
          $names = [ordered]@{
            VALIDATE_TENANT_ID              = 'TEST_BAMI_TENANT_ID'
            VALIDATE_CLIENT_ID              = 'TEST_BAMI_BICEP_CLIENT_ID'
            TEST_SUBSCRIPTION_IDS           = 'TEST_BAMI_SUBSCRIPTION_IDS'
            ARM_MGMTGROUP_ID                = 'TEST_BAMI_MANAGEMENT_GROUP_ID'
            TEST_PERSISTENT_SUBSCRIPTION_ID = 'TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID'
          }
          if ($settings.Count -ne $names.Count) {
            throw 'The frozen BAMI execution settings are incomplete.'
          }
          foreach ($name in $names.Keys) {
            $value = $settings[$names[$name]]
            if ($value -isnot [string] -or [string]::IsNullOrWhiteSpace($value) -or $value -match '[\r\n]') {
              throw "The frozen BAMI setting [$($names[$name])] is missing or invalid."
            }
            $values[$name] = $value
          }

          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionList.ps1')
          $subscriptions = @(Get-TestSubscriptionList -TestSubscriptionIds $values.TEST_SUBSCRIPTION_IDS)
          $values.VALIDATE_SUBSCRIPTION_ID = $subscriptions[0].id
          $values.AZURE_CREDENTIALS = ''
          $values.CI_KEY_VAULT_NAME = ''
        }

        foreach ($entry in $values.GetEnumerator()) {
          Write-Output ("{0}={1}" -f $entry.Key, $entry.Value) >> $env:GITHUB_ENV
        }
