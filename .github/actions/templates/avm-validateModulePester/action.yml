name: "Execute Pester module tests"
description: "Execute packaged module checks and repository governance tests"

inputs:
  modulePath:
    description: "The path to the module's folder"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Build Bicep test files"
      shell: pwsh
      env:
        MODULE_PATH: ${{ inputs.modulePath }}
      run: |
        $modulePath = Join-Path $env:GITHUB_WORKSPACE $env:MODULE_PATH
        Get-ChildItem -LiteralPath $modulePath -Filter '*.test.bicep' -File -Recurse -ErrorAction Stop | ForEach-Object {
          Write-Output "Building $($_.FullName)"
          bicep build $_.FullName --stdout | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Bicep build failed for $($_.FullName) with exit code $LASTEXITCODE"
          }
        }

    - name: "Run Pester tests"
      id: pester_run_step
      shell: pwsh
      env:
        MODULE_PATH: ${{ inputs.modulePath }}
      run: |
        $ErrorActionPreference = 'Stop'
        $repoRootPath = $env:GITHUB_WORKSPACE
        . (Join-Path $repoRootPath 'utilities' 'pipelines' 'sharedScripts' 'Initialize-AvmPester.ps1')
        Import-Module Avm.Authoring -MinimumVersion '1.1.0' -ErrorAction Stop
        Initialize-AvmPester -RepoRootPath $repoRootPath

        $modulePath = Join-Path $repoRootPath $env:MODULE_PATH
        $docs = Invoke-AvmDocs -Path $modulePath -Ecosystem bicep -CheckDrift -SkipModuleVersionCheck
        if ($docs.Status -ne 'pass') {
          throw "README validation failed: $($docs.Issues | ConvertTo-Json -Depth 10 -Compress)"
        }

        $moduleTests = Invoke-AvmTestUnit -Path $modulePath -Ecosystem bicep -IncludeCompliance -Recurse -SkipModuleVersionCheck
        $moduleTests | ConvertTo-Json -Depth 10 | Out-File -FilePath 'module-test-results.json' -Encoding utf8
        if ($moduleTests.Status -ne 'pass') {
          throw "Module validation failed: $($moduleTests.Issues | ConvertTo-Json -Depth 10 -Compress)"
        }

        $configuration = @{
          Run = @{
            Container = New-PesterContainer -Path (Join-Path $repoRootPath 'utilities' 'pipelines' 'staticValidation' 'compliance' 'governance.tests.ps1') -Data @{
              RepoRootPath = $repoRootPath
            }
            PassThru = $true
          }
          Output = @{ Verbosity = 'Detailed' }
        }
        $governance = Invoke-Pester -Configuration $configuration
        $governance | ConvertTo-Json -Depth 3 | Out-File -FilePath 'governance-test-results.json' -Encoding utf8
        if ($governance.Result -ne 'Passed') {
          throw "Repository governance validation failed: $($governance.Result)"
        }

        "Module checks: $($moduleTests.Status); governance: $($governance.Result)" >> $env:GITHUB_STEP_SUMMARY

    - name: "Upload test results"
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Upload & store test results
        path: |
          module-test-results.json
          governance-test-results.json
