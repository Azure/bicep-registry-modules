#########################################################
## 'Deploy module' Composite Action                    ##
#########################################################
##
## This composite action contains the logic to both test and execute the deployment of a given template and parameter file.
## By default, tested deployments are also removed. Optionally, the removal step can be skipped.
##
#########################################################
##
##-------------------------------------------##
## ACTION PARAMETERS                         ##
##-------------------------------------------##
##
##   |======================================================================================================================================================================================|
##   | Parameter                  | Required | Default | Description                                           | Example                                                                    |
##   |----------------------------|----------|---------|-------------------------------------------------------|----------------------------------------------------------------------------|
##   | modulePath                 | true     | ''      | The path to the module file directory                 | 'modules/api-management/service/main.bicep'                                |
##   | templateFilePath           | true     | ''      | The path to the template file to use for deployment   | 'modules/api-management/service/tests/e2e/maix/main.test.bicep'            |
##   | deploymentMetadataLocation | true     | ''      | The location to store the deployment metadata         | 'WestEurope'                                                               |
##   | subscriptionSelectionSeed  | false    | ''      | Legacy shared seed when no subscription is preselected | '12345'                                                                  |
##   | subscriptionJobIndex       | false    | '0'     | Matrix job index for round-robin subscription selection | '0'                                                                      |
##   | subscriptionIndex          | false    | ''      | Preselected position in the unshuffled subscription pool | '0'                                                                     |
##   | subscriptionKey            | false    | ''      | SHA-256 of the preselected canonical subscription ID   |                                                                          |
##   | managementGroupId          | false    | ''      | The managementGroupId to deploy to                    | '1a97b80a-4dda-4f50-ab53-349e29344654'                                     |
##   | customTokens               | false    | ''      | Additional token pairs in json format.                | '{"tokenName":"tokenValue"}'                                               |
##   | removeDeployment           | false    | 'true'  | Set "true" to set module up for removal               | 'true'                                                                     |
##   | customLocation             | false    |         | Custom location overwrite, if needed                  | 'WestEurope'                                                               |
##   |======================================================================================================================================================================================|
##
#########################################################

name: "Deploy module"
description: >-
  Validate and deploy with at most three distinct supported, allowed resource regions
  and three total deployment attempts. Wholly regional deployment failures may relocate
  only after the exact deployment is confirmed Failed and its resources and records
  are completely removed. Existing safe same-region retries share the total attempt
  budget. Custom, CI and token locations, global resources and resource-group scope
  do not relocate. Retained resources disable intermediate cleanup and relocation.
  Metadata location and other inputs remain fixed. Cleanup retains attempt tracking and only
  skips missing records after confirmed preflight rejection and DeploymentNotFound.
  After a submission request timeout, observe the same deployment for up to 60 minutes
  without resubmitting; only confirmed failure permits a bounded retry. Unknown
  outcomes preserve attempted deployment names for cleanup. A preselected subscription is
  verified before login and reused through cleanup without reshuffling the pool.

inputs:
  modulePath:
    description: >-
      Exact module directory path used to determine the resource location and look up
      optional subscription features. Root .required-features.json maps module paths
      to arrays of "Namespace/FeatureName" strings. Registration runs after login,
      before validation, and persists after testing. Missing or empty requirements
      are skipped; the test identity needs feature and provider registration permissions.
    required: true
  templateFilePath:
    description: "The path to the template file to use for deployment"
    required: true
  deploymentMetadataLocation:
    description: "The location to store the deployment metadata"
    required: true
  subscriptionSelectionSeed:
    description: "Legacy shared shuffle seed, required only when subscriptionIndex and subscriptionKey are not provided"
    required: false
  subscriptionJobIndex:
    description: "Matrix job index used to assign a subscription from the shuffled pool"
    default: "0"
    required: false
  subscriptionIndex:
    description: "Preselected index in the original, unshuffled subscription pool"
    required: false
  subscriptionKey:
    description: "SHA-256 digest of the preselected canonical subscription ID; a changed pool fails before login"
    required: false
  managementGroupId:
    description: "The management group ID to deploy to"
    required: false
  customTokens:
    description: 'Additional parameter file token pairs in json format. e.g. {"tokenName":"tokenValue"}'
    required: false
  githubVariables:
    description: "Resolved GitHub Actions vars context as JSON. CI_ ignores underscores; CI__ preserves literal spelling."
    default: "{}"
    required: false
  githubSecrets:
    description: "Resolved GitHub Actions secrets context as JSON. CI_ or CI__ secrets override variables for the same parameter."
    default: "{}"
    required: false
  removeDeployment:
    description: 'Set "true" to set module up for removal'
    default: "true"
    required: false
  customLocation:
    description: "Pinned resource location; regional validation does not select another location. Must agree with any CI or token resourceLocation."
    required: false
  e2eIgnore:
    description: "If set to true, the test case deployment tasks will not be processed"
    default: "false"
    required: false

runs:
  using: "composite"
  steps:
    # [Deployment validation] task(s)
    # -------------------------------
    - name: "Validate Test Execution"
      uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2
      with:
        azPSVersion: "latest"
        errorActionPreference: "SilentlyContinue"
        inlineScript: |
          # Resolve template file path
          $moduleTestFilePath = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.templateFilePath }}'

          # Check if the deployment test should be bypassed
          if ('${{ inputs.e2eIgnore }}' -eq 'true') {
            Write-Warning -Message "File '.e2eignore' exists in the folder: $moduleTestFilePath"
            Write-Output 'skip_deployment_ci=true' >> $env:GITHUB_ENV

            # Get the reason for skipping the deployment
            $excludeReason = Get-Content Join-Path $moduleTestFilePath '.e2eignore'
            excludeMessage = "Skipping deployment for ${{ inputs.templateFilePath }}: $excludeReason"

            Write-Output "Skipping deployment for ${{ inputs.templateFilePath }}: $excludeMessage"
            Write-Warning "Skipping deployment for ${{ inputs.templateFilePath }}: $excludeMessage"
          } else {
            Write-Output "File '.e2eignore' does not exist in the folder: $moduleTestFilePath" -Verbose
            Write-Output "skip_deployment_ci=false" >> $env:GITHUB_ENV
          }

    - name: "Warn about CI Key Vault deprecation"
      if: env.skip_deployment_ci == 'false' && env.CI_KEY_VAULT_NAME != ''
      shell: pwsh
      run: |
        Write-Output '::warning title=CI Key Vault deprecation::CI_KEY_VAULT_NAME support may be removed in a future release. Use CI_-prefixed GitHub Actions secrets or variables instead. GitHub secrets override variables, and both override Key Vault values.'

    - name: "Select test subscription"
      id: get-test-subscription
      if: env.skip_deployment_ci == 'false'
      shell: pwsh
      env:
        SUBSCRIPTION_SELECTION_SEED: ${{ inputs.subscriptionSelectionSeed }}
        SUBSCRIPTION_JOB_INDEX: ${{ inputs.subscriptionJobIndex }}
        PRESELECTED_SUBSCRIPTION_INDEX: ${{ inputs.subscriptionIndex }}
        PRESELECTED_SUBSCRIPTION_KEY: ${{ inputs.subscriptionKey }}
        MANAGEMENT_GROUP_ID: ${{ inputs.managementGroupId }}
      run: |
        . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionList.ps1')

        if (-not [string]::IsNullOrEmpty($env:TEST_SUBSCRIPTION_IDS) -and
            [string]::IsNullOrWhiteSpace($env:TEST_SUBSCRIPTION_IDS)) {
          throw 'The configured test subscription pool must not contain only whitespace.'
        }
        $functionInput = @{
          TestSubscriptionIds    = $env:TEST_SUBSCRIPTION_IDS
          FallbackSubscriptionId = $env:VALIDATE_SUBSCRIPTION_ID
        }
        if (-not [string]::IsNullOrEmpty($env:PRESELECTED_SUBSCRIPTION_INDEX) -or
            -not [string]::IsNullOrEmpty($env:PRESELECTED_SUBSCRIPTION_KEY)) {
          $subscriptions = @(Get-TestSubscriptionList @functionInput -Verbose)
          $subscriptionIndex = -1
          if (-not [int]::TryParse($env:PRESELECTED_SUBSCRIPTION_INDEX, [ref] $subscriptionIndex) -or
              $subscriptionIndex -lt 0 -or $subscriptionIndex -ge $subscriptions.Count) {
            throw 'The preselected subscription index is invalid for the configured pool.'
          }
          $subscription = $subscriptions[$subscriptionIndex]
          if ($subscription.key -cne $env:PRESELECTED_SUBSCRIPTION_KEY) {
            throw 'The configured subscription pool no longer matches the preselected subscription identity.'
          }
        } else {
          $functionInput.RandomSeed = [int]::Parse($env:SUBSCRIPTION_SELECTION_SEED)
          $subscriptions = @(Get-TestSubscriptionList @functionInput -Verbose)
          $jobIndex = [int]::Parse($env:SUBSCRIPTION_JOB_INDEX)
          if ($jobIndex -lt 0) {
            throw 'The subscription job index must not be negative.'
          }
          $subscription = $subscriptions[$jobIndex % $subscriptions.Count]
        }

        Write-Output ("subscriptionId={0}" -f $subscription.id) >> $env:GITHUB_OUTPUT
        Write-Verbose ("Using test subscription [{0}] from a pool of [{1}]." -f $subscription.name, $subscriptions.Count) -Verbose

    # [Azure login] task(s)
    # ------------------------------
    - name: "Set OIDC temporary exception"
      id: set-oidc-exception
      if: env.skip_deployment_ci == 'false'
      uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2
      env:
        SELECTED_SUBSCRIPTION_ID: ${{ steps.get-test-subscription.outputs.subscriptionId }}
      with:
        azPSVersion: "latest"
        inlineScript: |
          # Grouping task logs
          Write-Output '::group::Set OIDC exception'

          # List of modules requiring service principal + secret authentication
          $modulePath = "${{ inputs.modulePath }}"
          $exceptionModulePaths = @(
            'avm/res/azure-stack-hci/cluster'                    # Failing on resource deletion when trying to delete RBAC at subscription level
            'avm/res/azure-stack-hci/logical-network'            # Failing on resource deletion when trying to delete RBAC at subscription level
            'avm/res/azure-stack-hci/network-interface'          # Failing on resource deletion when trying to delete RBAC at subscription level
            'avm/res/azure-stack-hci/virtual-hard-disk'          # Failing on resource deletion when trying to delete RBAC at subscription level
            'avm/res/azure-stack-hci/virtual-machine-instance'   # Failing on resource deletion when trying to delete RBAC at subscription level
            'avm/res/hybrid-container-service/provisioned-cluster-instance' # Failing on resource deletion when trying to delete RBAC at subscription level
          )
          if (@(
            $exceptionModulePaths | Where-Object { $modulePath -eq $_ -or $modulePath.StartsWith("$_/") }
          ).Count -gt 0) {
            $oidcException = 'true'
            Write-Verbose ('The module [{0}] is in the list of modules temporarily requiring an exception to OIDC.' -f $modulePath) -Verbose
          } else {
            foreach ($name in @('VALIDATE_CLIENT_ID', 'VALIDATE_TENANT_ID')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "OIDC authentication requires [$name]."
              }
            }
            $oidcException = 'false'
            Write-Verbose ('The module [{0}] supports OIDC.' -f $modulePath) -Verbose
          }

          if ($oidcException -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:AZURE_CREDENTIALS)) {
              throw 'This module requires AZURE_CREDENTIALS for service principal authentication.'
            }
            try {
              $credentials = ConvertFrom-Json -InputObject $env:AZURE_CREDENTIALS -AsHashtable -NoEnumerate -ErrorAction Stop
            } catch [System.ArgumentException] {
              throw 'AZURE_CREDENTIALS must be a valid JSON object.'
            }
            if ($credentials -isnot [System.Collections.IDictionary]) {
              throw 'AZURE_CREDENTIALS must be a JSON object.'
            }
            foreach ($name in @('clientId', 'clientSecret', 'tenantId')) {
              if ($credentials[$name] -isnot [string] -or [string]::IsNullOrWhiteSpace($credentials[$name])) {
                throw "AZURE_CREDENTIALS requires a non-empty string [$name]."
              }
            }
            if (-not [string]::IsNullOrEmpty($env:VALIDATE_TENANT_ID) -and
                $credentials['tenantId'] -ine $env:VALIDATE_TENANT_ID) {
              throw 'AZURE_CREDENTIALS tenantId must match the configured VALIDATE_TENANT_ID.'
            }
            $credentials['subscriptionId'] = $env:SELECTED_SUBSCRIPTION_ID
            $credentialsJson = ConvertTo-Json -InputObject $credentials -Depth 10 -Compress
            Write-Output "::add-mask::$credentialsJson"
            Write-Output "azureCredentials=$credentialsJson" >> $env:GITHUB_OUTPUT
          }

          $tenantId = if ($oidcException -eq 'true') { $credentials['tenantId'] } else { $env:VALIDATE_TENANT_ID }
          Write-Output ('{0}={1}' -f 'tenantId', $tenantId) >> $env:GITHUB_OUTPUT
          Write-Output ('{0}={1}' -f 'oidcException', $oidcException) >> $env:GITHUB_OUTPUT
          Write-Output '::endgroup::'

    # Default: support both OIDC and service principal with secret
    # 'creds' will be ignored if 'client-id', 'subscription-id' or 'tenant-id' is set
    - name: "Azure Login - Default"
      if: ${{ steps.set-oidc-exception.outputs.oidcException == 'false' && env.skip_deployment_ci == 'false' }}
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        client-id: ${{ env.VALIDATE_CLIENT_ID }}
        tenant-id: ${{ env.VALIDATE_TENANT_ID }}
        subscription-id: ${{ steps.get-test-subscription.outputs.subscriptionId }}
        enable-AzPSSession: true

    # Exception: module requires login by using service principal with secret
    # Should only be leveraged by modules listed in $exceptionModulePaths above
    - name: "Azure Login - Exception"
      if: ${{ steps.set-oidc-exception.outputs.oidcException == 'true'  && env.skip_deployment_ci == 'false'}}
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        creds: ${{ steps.set-oidc-exception.outputs.azureCredentials }}
        enable-AzPSSession: true

    - name: "Register required subscription features"
      id: register-required-features
      if: env.skip_deployment_ci == 'false'
      shell: pwsh
      env:
        MODULE_PATH: ${{ inputs.modulePath }}
        SELECTED_SUBSCRIPTION_ID: ${{ steps.get-test-subscription.outputs.subscriptionId }}
        SELECTED_TENANT_ID: ${{ steps.set-oidc-exception.outputs.tenantId }}
      run: |
        $ErrorActionPreference = 'Stop'
        . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Register-RequiredSubscriptionFeature.ps1')

        $functionInput = @{
          RepoRootPath   = $env:GITHUB_WORKSPACE
          ModulePath     = $env:MODULE_PATH
          SubscriptionId = $env:SELECTED_SUBSCRIPTION_ID
          TenantId       = $env:SELECTED_TENANT_ID
        }
        $null = Register-RequiredSubscriptionFeature @functionInput -Verbose

    # [Token replacement] task(s)
    # ---------------------------
    - name: "Replace tokens in template file"
      id: replace-tokens
      if: env.skip_deployment_ci == 'false'
      uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2
      with:
        azPSVersion: "latest"
        inlineScript: |
          # Grouping task logs
          Write-Output '::group::Replace tokens in template file'

          # Load used functions
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'tokenReplacement' 'Convert-TokensInFileList.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-LocallyReferencedFileList.ps1')

          $templateFilePath = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.templateFilePath }}'

          # Get target files
          $targetFileList = @(
            $templateFilePath
          )

          # Add all module template files as they may contain tokens
          $targetFileList += (Get-LocallyReferencedFileList -FilePath $templateFilePath)
          $targetFileList = $targetFileList | Sort-Object -Unique

          # Construct Token Function Input
          $ConvertTokensInputs = @{
            FilePathList = $targetFileList
            Tokens       = @{}
          }

          # Add enforced tokens
          $ConvertTokensInputs.Tokens += @{
            subscriptionId    = '${{ steps.get-test-subscription.outputs.subscriptionId }}'
            managementGroupId = '${{ inputs.managementGroupId }}'
            tenantId          = '${{ env.VALIDATE_TENANT_ID }}'
          }

          # Add local (source control) tokens
          $tokenMap = @{}
          foreach ($token in (Get-ChildItem env: | Where-Object -Property Name -Like "localToken_*")) {
            $tokenMap += @{ $token.Name.Replace('localToken_','','OrdinalIgnoreCase') = $token.value }
          }
          Write-Verbose ('Using local tokens [{0}]' -f ($tokenMap.Keys -join ', ')) -Verbose
          $ConvertTokensInputs.Tokens += $tokenMap

          # Swap 'namePrefix' token if empty and provided as a GitHub secret
          if([String]::IsNullOrEmpty($ConvertTokensInputs.Tokens['namePrefix'])){
            Write-Verbose 'Using [namePrefix] token from GitHub' -Verbose
            $ConvertTokensInputs.Tokens['namePrefix'] = '${{ env.TOKEN_NAMEPREFIX }}'
          }

          # Add custom tokens (passed in via the pipeline)
          if(-not [String]::IsNullOrEmpty('${{  inputs.customTokens }}')) {
            $customTokens = '${{ inputs.customTokens }}' | ConvertFrom-Json -AsHashTable
            Write-Verbose ('Using custom parameter file tokens [{0}]' -f ($customTokens.Keys -join ', ')) -Verbose
            $ConvertTokensInputs.Tokens += $customTokens
          }

          Write-Output ('resourceLocation={0}' -f $ConvertTokensInputs.Tokens['resourceLocation']) >> $env:GITHUB_OUTPUT
          $ConvertTokensInputs.Tokens.Remove('resourceLocation')
          Write-Verbose ('Replacing tokens [{0}]' -f ($ConvertTokensInputs.Tokens.Keys -join ', ')) -Verbose

          # Invoke Token Replacement Functionality [For Module]
          if (-not (Convert-TokensInFileList @ConvertTokensInputs)) {
            throw 'Template token replacement failed.'
          }

          Write-Output '::endgroup::'

    - name: "Deploy template file"
      id: deploy_step
      if: env.skip_deployment_ci == 'false'
      uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2
      env:
        AVM_CI_VARIABLES: ${{ inputs.githubVariables }}
        AVM_CI_SECRETS: ${{ inputs.githubSecrets }}
      with:
        azPSVersion: "latest"
        inlineScript: |
          # Grouping task logs
          Write-Output '::group::Validate and deploy template file'

          # Load used functions
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'e2eValidation' 'resourceDeployment' 'Invoke-TemplateDeploymentWithRetry.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-CIParameterMap.ps1')

          # Prepare general parameters
          # --------------------------
          # Fetching parameters
          $subscriptionId = '${{ steps.get-test-subscription.outputs.subscriptionId }}'
          $managementGroupId = '${{ inputs.managementGroupId }}'

          # Resolve template file path
          $moduleTestFilePath = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.templateFilePath }}'

          # Determine possible parameters depending on file type
          if ((Split-Path $moduleTestFilePath -Extension) -eq '.bicep') {
            $moduleTemplateContent = bicep build $moduleTestFilePath --stdout | ConvertFrom-Json -AsHashtable
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to compile the test template.'
            }
          } else {
            $moduleTemplateContent = Get-Content $moduleTestFilePath -Raw | ConvertFrom-Json -AsHashtable
          }
          $moduleTemplateParameters = $moduleTemplateContent.parameters ?? @{}
          $moduleTemplatePossibleParameters = $moduleTemplateParameters.psbase.Keys

          # ----------------- #
          # Invoke validation #
          # ----------------- #
          $functionInput = @{
            TemplateFilePath           = $moduleTestFilePath
            DeploymentMetadataLocation = '${{ inputs.deploymentMetadataLocation }}'
            SubscriptionId             = $subscriptionId
            ManagementGroupId          = $managementGroupId
            RepoRoot                   = $env:GITHUB_WORKSPACE
            AdditionalParameters       = @{}
          }

          # Add custom parameters as needed
          if($moduleTemplatePossibleParameters -contains 'resourceLocation') {
            $functionInput.AdditionalParameters += @{
              resourceLocation = ''
            }
          }
          if($moduleTemplatePossibleParameters -contains 'baseTime') {
            $functionInput.AdditionalParameters += @{
              baseTime = (Get-Date).ToString('u') # Setting base time explicitly so that any potential retry will reuse the same timestamp
            }
          }

          $ciParameterInput = @{
            TemplateParameters  = $moduleTemplateParameters
            TemplateDefinitions = $moduleTemplateContent.definitions ?? @{}
            GitHubVariables     = $env:AVM_CI_VARIABLES
            GitHubSecrets       = $env:AVM_CI_SECRETS
            KeyVaultName        = $env:CI_KEY_VAULT_NAME
          }
          $ciParameters = Get-CIParameterMap @ciParameterInput
          foreach ($parameter in $ciParameters.GetEnumerator()) {
            $functionInput.AdditionalParameters[$parameter.Key] = $parameter.Value
          }

          Write-Verbose 'Invoke task with' -Verbose
          $logInput = $functionInput.Clone()
          $logInput.AdditionalParameters = @($functionInput.AdditionalParameters.psbase.Keys)
          Write-Verbose ($logInput | ConvertTo-Json | Out-String) -Verbose

          $retryInput = @{
            TemplateInput         = $functionInput
            ModuleRoot            = '${{ inputs.modulePath }}'
            CustomLocation        = '${{ inputs.customLocation }}'
            TokenResourceLocation = '${{ steps.replace-tokens.outputs.resourceLocation }}'
            RemoveDeployment      = '${{ inputs.removeDeployment }}' -eq 'true'
            DoNotThrow            = $true
          }
          $res = Invoke-TemplateDeploymentWithRetry @retryInput -Verbose

          # Get deployment name
          $deploymentNames = @($res.deploymentNames ?? @())
          $deploymentNamesJson = $deploymentNames.Count -gt 0 ? (ConvertTo-Json -InputObject $deploymentNames -Compress) : ''
          Write-Output ('{0}={1}' -f 'deploymentNames', $deploymentNamesJson) >> $env:GITHUB_OUTPUT
          Write-Output ('{0}={1}' -f 'remainingDeploymentNames', (ConvertTo-Json -InputObject @($res.remainingDeploymentNames ?? @()) -Compress)) >> $env:GITHUB_OUTPUT
          Write-Output ('{0}={1}' -f 'preflightRejectedDeploymentNames', (ConvertTo-Json -InputObject @($res.preflightRejectedDeploymentNames ?? @()) -Compress)) >> $env:GITHUB_OUTPUT

          # Populate further outputs
          $deploymentOutput = ($res.deploymentOutput | ConvertTo-Json -Depth 99 -Compress) -replace "'", "''" # Escaping single quotes for resilient access in subsequent steps
          Write-Output ('{0}={1}' -f 'deploymentOutput', $deploymentOutput) >> $env:GITHUB_OUTPUT

          Write-Verbose "Deployment output: $deploymentOutput" -Verbose

          if ($res.ContainsKey('exception')) {
            # Happens only if there is an exception
            throw $res.exception
          }
          Write-Output ('resourceLocation={0}' -f $res.resourceLocation) >> $env:GITHUB_OUTPUT

          Write-Output '::endgroup::'

    # [Azure login] task(s)
    # ------------------------------
    # Default: support both OIDC and service principal with secret
    # 'creds' will be ignored if 'client-id', 'subscription-id' or 'tenant-id' is set
    - name: "Azure Login - Default"
      if: ${{ steps.set-oidc-exception.outputs.oidcException == 'false' && env.skip_deployment_ci == 'false' }}
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        client-id: ${{ env.VALIDATE_CLIENT_ID }}
        tenant-id: ${{ env.VALIDATE_TENANT_ID }}
        subscription-id: ${{ steps.get-test-subscription.outputs.subscriptionId }}
        enable-AzPSSession: true

    # Exception: module requires login by using service principal with secret
    # Should only be leveraged by modules listed in $exceptionModulePaths above
    - name: "Azure Login - Exception"
      if: ${{ steps.set-oidc-exception.outputs.oidcException == 'true'  && env.skip_deployment_ci == 'false'}}
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        creds: ${{ steps.set-oidc-exception.outputs.azureCredentials }}
        enable-AzPSSession: true

    # [Post-Deployment test] task(s)
    # ------------------------------
    - name: "Run post-deployment Pester tests"
      if: env.skip_deployment_ci == 'false'
      id: pester_run_step
      shell: pwsh
      run: |
        # Grouping task logs
        Write-Output '::group::Run Pester tests'

        # Load used functions
        . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'staticValidation' 'compliance' 'Set-PesterGitHubOutput.ps1')

        # Set repo root path
        $repoRootPath = $env:GITHUB_WORKSPACE

        $moduleTestFilePath = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.templateFilePath }}'
        $moduleTestFolderPath = Split-Path $moduleTestFilePath
        $moduleTestFolderName = Split-Path $moduleTestFolderPath -Leaf

        $deploymentOutputs = '${{ steps.deploy_step.outputs.deploymentOutput }}' | ConvertFrom-Json -AsHashTable

        # --------------------- #
        # Invoke Pester test(s) #
        # --------------------- #

        $pesterConfiguration = @{
          Run    = @{
            Container = New-PesterContainer -Path $moduleTestFolderPath -Data @{
              TestInputData = @{
                DeploymentOutputs    = $deploymentOutputs    # Passing in in case we want to directly validate data via the deployment's output
                ModuleTestFolderPath = $moduleTestFolderPath # Passing in in case we want to access any data in the test folder / files
              }
            }
            PassThru  = $true
          }
          Output = @{
            Verbosity = 'Detailed'
          }
        }

        Write-Verbose 'Invoke test with' -Verbose
        $foundTestPaths = $pesterConfiguration.Run.Container | Where-Object { -not [String]::IsNullOrEmpty($_.Item.FullName) } | Foreach-Object { ($_.Item.FullName -split '[\\|\/]tests[\\|\/]e2e[\\|\/]')[1] }

        if($foundTestPaths.Count -gt 0) {
          Write-Verbose ('Path(s): {0}' -f ($foundTestPaths | Convertto-Json)) -Verbose
          Write-Verbose ('Data: {0}' -f ($pesterConfiguration.Run.Container.Data[0] | ConvertTo-Json -Depth 3)) -Verbose

          $testResults = Invoke-Pester -Configuration $pesterConfiguration

          # ----------------------------------------- #
          # Create formatted Pester Test Results File #
          # ----------------------------------------- #

          $functionInput = @{
            PesterTestResults = $testResults
            OutputFilePath    = Join-Path $env:GITHUB_WORKSPACE 'avm' "$moduleTestFolderName-Pester-output.md"
            GitHubRepository  = $env:GITHUB_REPOSITORY
            BranchName        = $env:GITHUB_REF
            Title             = 'Pester post-deployment validation summary'
          }

          Write-Verbose 'Invoke Pester formatting function with' -Verbose
          Write-Verbose ($functionInput | ConvertTo-Json -Depth 0 | Out-String) -Verbose

          Set-PesterGitHubOutput @functionInput -Verbose

          Write-Output ('{0}={1}' -f 'formattedPesterResultsPath', $functionInput.outputFilePath) >> $env:GITHUB_OUTPUT
        } else {
          Write-Verbose 'Found no Pester test files (*.test.ps1) in test folder' -Verbose
          Write-Output ('{0}={1}' -f 'formattedPesterResultsPath', '') >> $env:GITHUB_OUTPUT
        }

    - name: "Output to GitHub job summaries"
      if: env.skip_deployment_ci == 'false' && steps.pester_run_step.outputs.formattedPesterResultsPath != ''
      shell: pwsh
      run: |
        # Grouping task logs
        Write-Output '::group::Output to GitHub job summaries'

        $mdPesterOutputFilePath = '${{ steps.pester_run_step.outputs.formattedPesterResultsPath }}'

        if (-not (Test-Path $mdPesterOutputFilePath)) {
          Write-Warning ('Input file [{0}] not found. Please check if the previous task threw an error and try again.' -f $mdPesterOutputFilePath)
        } else {
          Get-Content $mdPesterOutputFilePath >> $env:GITHUB_STEP_SUMMARY
          Write-Verbose ('Successfully printed out file [{0}] to Job Summaries' -f $mdPesterOutputFilePath) -Verbose
        }

        Write-Output '::endgroup::'

    # [Deployment removal] task(s)
    # ----------------------------
    - name: "Remove deployed resources"
      if: ${{ (success() || failure()) && inputs.removeDeployment == 'true' && steps.deploy_step.outputs.deploymentNames != '' && env.skip_deployment_ci == 'false' }}
      uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2
      with:
        azPSVersion: "latest"
        inlineScript: |
          # Grouping task logs
          Write-Output '::group::Remove deployed resources'

          # Load used function
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'e2eValidation' 'resourceRemoval' 'Initialize-DeploymentRemoval.ps1')

          $functionInput = @{
            TemplateFilePath  = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.templateFilePath }}'
            DeploymentNames   = '${{ steps.deploy_step.outputs.deploymentNames }}' | ConvertFrom-Json
            ManagementGroupId = '${{ inputs.managementGroupId }}'
          }

          $preflightRejectedDeploymentNames = '${{ steps.deploy_step.outputs.preflightRejectedDeploymentNames }}'
          $remainingDeploymentNames = '${{ steps.deploy_step.outputs.remainingDeploymentNames }}'
          if (-not [string]::IsNullOrWhiteSpace($remainingDeploymentNames)) {
            $functionInput.DeploymentNames = @($remainingDeploymentNames | ConvertFrom-Json -ErrorAction Stop)
            if ($functionInput.DeploymentNames.Count -eq 0) {
              Write-Verbose 'All submitted deployments were already completely removed.' -Verbose
              Write-Output '::endgroup::'
              return
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($preflightRejectedDeploymentNames)) {
            $functionInput['PreflightRejectedDeploymentNames'] = @($preflightRejectedDeploymentNames | ConvertFrom-Json -ErrorAction Stop |
              Where-Object { $_ -in $functionInput.DeploymentNames })
          }

          if (-not [String]::IsNullOrEmpty('${{ steps.get-test-subscription.outputs.subscriptionId }}')) {
              $functionInput['SubscriptionId'] = '${{ steps.get-test-subscription.outputs.subscriptionId }}'
          }

          Write-Verbose 'Invoke task with' -Verbose
          Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

          Initialize-DeploymentRemoval @functionInput

          Write-Output '::endgroup::'
