name: ".Platform - Clean up deployment history"

on:
  workflow_dispatch:
    inputs:
      handleSubscriptionScope:
        type: boolean
        description: "Include Subscription deployments"
        required: false
        default: true # Note: This requires your service principal to have permissions on the subscription scope.
      handleManagementGroupScope:
        type: boolean
        description: "Include Management Group deployments"
        required: false
        default: true # Note: This requires your service principal to have permissions on the management group scope.
      maxDeploymentRetentionInDays:
        type: string
        description: "The number of days to keep deployments with status [failed]" # 'Running' are always excluded
        required: false
        default: "14"
  schedule:
    - cron: "0 0 * * *"

env:
  workflowPath: ".github/workflows/platform.deployment.history.cleanup.yml"

jobs:
  ###########################
  #   Initialize pipeline   #
  ###########################
  job_initialize_pipeline:
    runs-on: ubuntu-latest
    name: "Initialize pipeline"
    environment: avm-validation
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Set input parameters to output variables"
        id: get-workflow-param
        uses: ./.github/actions/templates/avm-getWorkflowInput
        with:
          workflowPath: "${{ env.workflowPath}}"
      - name: "Route subscription history maintenance"
        id: history-pools
        if: ${{ fromJson(steps.get-workflow-param.outputs.workflowInput).handleSubscriptionScope == 'true' }}
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          VALIDATE_SUBSCRIPTION_ID: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionList.ps1')
          $subscriptions = @(Get-TestSubscriptionList -TestSubscriptionIds $env:TEST_SUBSCRIPTION_IDS -FallbackSubscriptionId $env:VALIDATE_SUBSCRIPTION_ID)
          $reserved = @($subscriptions | Where-Object tag -CEQ 'Azure Local' | ForEach-Object {
            @{
              subscriptionIndex = $_.index
              subscriptionKey = $_.key
              environmentConcurrencyGroup = "avm-hci-$($_.key)"
            }
          })
          "reservedSubscriptions=$(ConvertTo-Json -InputObject $reserved -Compress)" >> $env:GITHUB_OUTPUT
          "hasReservedSubscriptions=$(($reserved.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "hasOrdinarySubscriptions=$((@($subscriptions | Where-Object tag -CNE 'Azure Local').Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
    outputs:
      workflowInput: ${{ steps.get-workflow-param.outputs.workflowInput }}
      reservedSubscriptions: ${{ steps.history-pools.outputs.reservedSubscriptions }}
      hasReservedSubscriptions: ${{ steps.history-pools.outputs.hasReservedSubscriptions }}
      hasOrdinarySubscriptions: ${{ steps.history-pools.outputs.hasOrdinarySubscriptions }}

  ###############
  #   Removal   #
  ###############
  job_cleanup_subscription_deployments:
    runs-on: ubuntu-latest
    name: "Remove Subscription deployments"
    environment: avm-validation
    permissions:
      id-token: write # For OIDC
    needs:
      - job_initialize_pipeline
    if: ${{ fromJson(needs.job_initialize_pipeline.outputs.workflowInput).handleSubscriptionScope == 'true' && needs.job_initialize_pipeline.outputs.hasOrdinarySubscriptions == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set environment
        uses: ./.github/actions/templates/avm-setEnvironment

      - name: Get test subscriptions
        id: get-test-subscriptions
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          VALIDATE_SUBSCRIPTION_ID: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionList.ps1')

          $subscriptions = @(Get-TestSubscriptionList -TestSubscriptionIds $env:TEST_SUBSCRIPTION_IDS -FallbackSubscriptionId $env:VALIDATE_SUBSCRIPTION_ID -Verbose |
            Where-Object tag -CNE 'Azure Local')
          if ($subscriptions.Count -eq 0) { throw 'The ordinary maintenance pool changed after selection.' }
          Write-Output ("subscriptionId={0}" -f $subscriptions[0].id) >> $env:GITHUB_OUTPUT
          Write-Output ("subscriptions={0}" -f (ConvertTo-Json -InputObject $subscriptions -Compress)) >> $env:GITHUB_OUTPUT

      # [Azure login] task(s)
      # ------------------------------
      # Supports both OIDC and service principal with secret
      # 'creds' will be ignored if 'client-id', 'subscription-id' or 'tenant-id' is set
      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.VALIDATE_CLIENT_ID || secrets.VALIDATE_CLIENT_ID }}
          tenant-id: ${{ vars.VALIDATE_TENANT_ID || secrets.VALIDATE_TENANT_ID }}
          subscription-id: ${{ steps.get-test-subscriptions.outputs.subscriptionId }}
          enable-AzPSSession: true

      - name: Remove deployments
        uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2.0.0
        env:
          TEST_SUBSCRIPTIONS: ${{ steps.get-test-subscriptions.outputs.subscriptions }}
        with:
          inlineScript: |
            # Load used functions
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'platform' 'deploymentRemoval' 'Clear-SubscriptionDeploymentHistory.ps1')

            foreach ($subscription in ($env:TEST_SUBSCRIPTIONS | ConvertFrom-Json)) {
              $functionInput = @{
                SubscriptionId               = $subscription.id
                maxDeploymentRetentionInDays = '${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).maxDeploymentRetentionInDays }}'
              }

              Write-Verbose "Invoke task with" -Verbose
              Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

              Clear-SubscriptionDeploymentHistory @functionInput
            }
          azPSVersion: "latest"

  job_cleanup_reserved_deployments:
    name: "Maintain reserved subscription [${{ matrix.testCase.subscriptionIndex }}]"
    needs: job_initialize_pipeline
    if: ${{ fromJson(needs.job_initialize_pipeline.outputs.workflowInput).handleSubscriptionScope == 'true' && needs.job_initialize_pipeline.outputs.hasReservedSubscriptions == 'true' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        testCase: ${{ fromJson(needs.job_initialize_pipeline.outputs.reservedSubscriptions) }}
    concurrency:
      group: ${{ matrix.testCase.environmentConcurrencyGroup }}
      queue: max
    uses: ./.github/workflows/avm.template.hci.history.yml
    with:
      testCase: ${{ toJson(matrix.testCase) }}
      maxDeploymentRetentionInDays: ${{ fromJson(needs.job_initialize_pipeline.outputs.workflowInput).maxDeploymentRetentionInDays }}
    secrets: inherit

  job_cleanup_managementGroup_deployments:
    runs-on: ubuntu-latest
    name: "Remove Management Group deployments"
    environment: avm-validation
    permissions:
      id-token: write # For OIDC
    needs:
      - job_initialize_pipeline
    if: ${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).handleManagementGroupScope == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set environment
        uses: ./.github/actions/templates/avm-setEnvironment

      - name: Get test subscriptions
        id: get-test-subscriptions
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          VALIDATE_SUBSCRIPTION_ID: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionList.ps1')

          $subscriptions = @(Get-TestSubscriptionList -TestSubscriptionIds $env:TEST_SUBSCRIPTION_IDS -FallbackSubscriptionId $env:VALIDATE_SUBSCRIPTION_ID -Verbose)
          Write-Output ("subscriptionId={0}" -f $subscriptions[0].id) >> $env:GITHUB_OUTPUT

      # [Azure login] task(s)
      # ------------------------------
      # Supports both OIDC and service principal with secret
      # 'creds' will be ignored if 'client-id', 'subscription-id' or 'tenant-id' is set
      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.VALIDATE_CLIENT_ID || secrets.VALIDATE_CLIENT_ID }}
          tenant-id: ${{ vars.VALIDATE_TENANT_ID || secrets.VALIDATE_TENANT_ID }}
          subscription-id: ${{ steps.get-test-subscriptions.outputs.subscriptionId }}
          enable-AzPSSession: true

      - name: Remove deployments
        uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2.0.0
        with:
          inlineScript: |
            # Load used functions
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'platform' 'deploymentRemoval' 'Clear-ManagementGroupDeploymentHistory.ps1')

            $mgmtGroupIdInput = '${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).customManagementGroupId }}'

            foreach($mgmtGroupId in @('${{ vars.VALIDATE_MANAGEMENT_GROUP_ID || vars.ARM_MGMTGROUP_ID || secrets.VALIDATE_MANAGEMENT_GROUP_ID || secrets.ARM_MGMTGROUP_ID }}', 'bicep-lz-vending-automation-child')) {
              Write-Verbose "Processing mgmtGroupId [$mgmtGroupId]" -Verbose
              $functionInput = @{
                ManagementGroupId            = $mgmtGroupId
                maxDeploymentRetentionInDays = '${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).maxDeploymentRetentionInDays }}'
              }

              Write-Verbose "Invoke task with" -Verbose
              Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

              Clear-ManagementGroupDeploymentHistory @functionInput
            }
          azPSVersion: "latest"
