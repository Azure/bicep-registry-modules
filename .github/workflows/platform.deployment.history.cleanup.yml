name: ".Platform - Clean up deployment history"

on:
  workflow_dispatch:
    inputs:
      handleSubscriptionScope:
        type: boolean
        description: "Include Subscription deployments"
        required: false
        default: true # Note: This requires your service principal to have permissions on the subscription scope.
      handleManagementGroupScope:
        type: boolean
        description: "Include Management Group deployments"
        required: false
        default: true # Note: This requires your service principal to have permissions on the management group scope.
      maxDeploymentRetentionInDays:
        type: string
        description: "The number of days to keep deployments with status [failed]" # 'Running' are always excluded
        required: false
        default: "14"
  schedule:
    - cron: "0 0 * * *"

env:
  workflowPath: ".github/workflows/platform.deployment.history.cleanup.yml"

jobs:
  ###########################
  #   Initialize pipeline   #
  ###########################
  job_initialize_pipeline:
    runs-on: ubuntu-latest
    name: "Initialize pipeline"
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Set input parameters to output variables"
        id: get-workflow-param
        uses: ./.github/actions/templates/avm-getWorkflowInput
        with:
          workflowPath: "${{ env.workflowPath}}"
    outputs:
      workflowInput: ${{ steps.get-workflow-param.outputs.workflowInput }}

  ###############
  #   Removal   #
  ###############
  job_cleanup_subscription_deployments:
    runs-on: ubuntu-latest
    name: "Remove Subscription deployments"
    environment: avm-validation
    permissions:
      id-token: write # For OIDC
    needs:
      - job_initialize_pipeline
    if: ${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).handleSubscriptionScope == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set environment
        uses: ./.github/actions/templates/avm-setEnvironment

      - name: Get test subscriptions
        id: get-test-subscriptions
        shell: pwsh
        env:
          TEST_BAMI_TENANT_ID: ${{ vars.TEST_BAMI_TENANT_ID }}
          TEST_BAMI_BICEP_CLIENT_ID: ${{ vars.TEST_BAMI_BICEP_CLIENT_ID }}
          TEST_BAMI_SUBSCRIPTION_IDS: ${{ vars.TEST_BAMI_SUBSCRIPTION_IDS }}
          TEST_BAMI_MANAGEMENT_GROUP_ID: ${{ vars.TEST_BAMI_MANAGEMENT_GROUP_ID }}
          TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID: ${{ vars.TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-BamiTestConfiguration.ps1')

          $configuration = Get-BamiTestConfiguration
          $subscriptions = $configuration.Subscriptions
          Write-Output ("subscriptionId={0}" -f $subscriptions[0].id) >> $env:GITHUB_OUTPUT
          Write-Output ("clientId={0}" -f $configuration.ClientId) >> $env:GITHUB_OUTPUT
          Write-Output ("tenantId={0}" -f $configuration.TenantId) >> $env:GITHUB_OUTPUT
          Write-Output ("subscriptions={0}" -f (ConvertTo-Json -InputObject $subscriptions -Compress)) >> $env:GITHUB_OUTPUT

      # [Azure login] task(s)
      # ------------------------------
      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ steps.get-test-subscriptions.outputs.clientId }}
          tenant-id: ${{ steps.get-test-subscriptions.outputs.tenantId }}
          subscription-id: ${{ steps.get-test-subscriptions.outputs.subscriptionId }}
          enable-AzPSSession: true

      - name: Remove deployments
        uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2.0.0
        env:
          TEST_SUBSCRIPTIONS: ${{ steps.get-test-subscriptions.outputs.subscriptions }}
        with:
          inlineScript: |
            # Load used functions
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'platform' 'deploymentRemoval' 'Clear-SubscriptionDeploymentHistory.ps1')

            foreach ($subscription in ($env:TEST_SUBSCRIPTIONS | ConvertFrom-Json)) {
              $functionInput = @{
                SubscriptionId               = $subscription.id
                maxDeploymentRetentionInDays = '${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).maxDeploymentRetentionInDays }}'
              }

              Write-Verbose "Invoke task with" -Verbose
              Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

              Clear-SubscriptionDeploymentHistory @functionInput
            }
          azPSVersion: "latest"

  job_cleanup_managementGroup_deployments:
    runs-on: ubuntu-latest
    name: "Remove Management Group deployments"
    environment: avm-validation
    permissions:
      id-token: write # For OIDC
    needs:
      - job_initialize_pipeline
    if: ${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).handleManagementGroupScope == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set environment
        uses: ./.github/actions/templates/avm-setEnvironment

      - name: Get test subscriptions
        id: get-test-subscriptions
        shell: pwsh
        env:
          TEST_BAMI_TENANT_ID: ${{ vars.TEST_BAMI_TENANT_ID }}
          TEST_BAMI_BICEP_CLIENT_ID: ${{ vars.TEST_BAMI_BICEP_CLIENT_ID }}
          TEST_BAMI_SUBSCRIPTION_IDS: ${{ vars.TEST_BAMI_SUBSCRIPTION_IDS }}
          TEST_BAMI_MANAGEMENT_GROUP_ID: ${{ vars.TEST_BAMI_MANAGEMENT_GROUP_ID }}
          TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID: ${{ vars.TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-BamiTestConfiguration.ps1')

          $configuration = Get-BamiTestConfiguration
          Write-Output ("subscriptionId={0}" -f $configuration.Subscriptions[0].id) >> $env:GITHUB_OUTPUT
          Write-Output ("clientId={0}" -f $configuration.ClientId) >> $env:GITHUB_OUTPUT
          Write-Output ("tenantId={0}" -f $configuration.TenantId) >> $env:GITHUB_OUTPUT
          Write-Output ("managementGroupId={0}" -f $configuration.ManagementGroupId) >> $env:GITHUB_OUTPUT

      # [Azure login] task(s)
      # ------------------------------
      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ steps.get-test-subscriptions.outputs.clientId }}
          tenant-id: ${{ steps.get-test-subscriptions.outputs.tenantId }}
          subscription-id: ${{ steps.get-test-subscriptions.outputs.subscriptionId }}
          enable-AzPSSession: true

      - name: Remove deployments
        uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2.0.0
        with:
          inlineScript: |
            # Load used functions
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'platform' 'deploymentRemoval' 'Clear-ManagementGroupDeploymentHistory.ps1')

            $functionInput = @{
              ManagementGroupId            = '${{ steps.get-test-subscriptions.outputs.managementGroupId }}'
              maxDeploymentRetentionInDays = '${{ (fromJson(needs.job_initialize_pipeline.outputs.workflowInput)).maxDeploymentRetentionInDays }}'
            }

            Write-Verbose "Invoke task with" -Verbose
            Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

            Clear-ManagementGroupDeploymentHistory @functionInput
          azPSVersion: "latest"
