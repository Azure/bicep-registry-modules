name: ".Module - Fork E2E feedback"

on:
  workflow_run:
    workflows: [".Module - PR Check"]
    types: [completed]

permissions: {}

jobs:
  feedback:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      pull-requests: write
    concurrency:
      group: fork-e2e-feedback-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: "Report fork E2E handoff"
        uses: Azure/azure-verified-modules-tools/.github/actions/report-check-status@84fe9be4947fa485c99afeb61ec9fc09a43c4c92
        with:
          ecosystem: bicep
          results: "{}"
          fork-run: "true"
