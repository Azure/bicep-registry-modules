name: ".Module - Check and Publish [EXPERIMENTAL]"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      staticValidation:
        type: boolean
        description: "Execute static validation"
        required: false
        default: true
      deploymentValidation:
        type: boolean
        description: "Execute deployment validation"
        required: false
        default: true
      removeDeployment:
        type: boolean
        description: "Remove deployed module"
        required: false
        default: true
      customLocation:
        type: string
        description: "Default location overwrite (e.g., eastus)"
        required: false
      createReleaseTag:
        type: boolean
        description: "Create the next top-level module release tag when no publishable diff exists"
        required: false
        default: false
      publishOnly:
        type: boolean
        description: "Skip validation and run only the publish step"
        required: false
        default: false
  pull_request:
    types:
      - labeled
      - synchronize
  push:
    branches:
      - main
    paths:
      - "avm/**"
      - "!avm/**/README.md"
      - "!avm/**/metadata.json"

permissions: {}

jobs:
  job_initialize_pipeline:
    runs-on: ubuntu-latest
    name: "Initialize pipeline"
    permissions:
      contents: read
    if: |
      !cancelled() &&
      !(github.repository != 'Azure/bicep-registry-modules' && github.event_name != 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'PR: Run Checks') &&
        (github.event.action != 'labeled' ||
          github.event.label.name == 'PR: Run Checks' ||
          github.event.label.name == 'PR: Run E2E Tests')
      ))
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - name: "Get module matrix"
        id: get-module-matrix
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-workflow-matrix@053d362184ace786c8c2977b673f3085a5203ddd
        with:
          avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
          baseCommit: "${{ github.event.before }}"
          targetCommit: "${{ github.sha }}"
          pullRequestHeadCommit: "${{ github.event.pull_request.head.sha }}"
          eventName: "${{ github.event_name }}"
          modulePaths: "${{ inputs.modulePaths }}"
          createReleaseTag: "${{ inputs.createReleaseTag }}"
          publishOnly: "${{ inputs.publishOnly }}"
          customLocation: "${{ inputs.customLocation }}"
          staticValidation: "${{ case(github.event_name == 'workflow_dispatch', inputs.staticValidation, true) }}"
          deploymentValidation: "${{ case(github.event_name == 'workflow_dispatch', inputs.deploymentValidation, github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'PR: Run Checks') && contains(github.event.pull_request.labels.*.name, 'PR: Run E2E Tests'))) }}"
          removeDeployment: "${{ case(github.event_name == 'workflow_dispatch', inputs.removeDeployment, true) }}"
    outputs:
      baseCommit: ${{ steps.get-module-matrix.outputs.baseCommit }}
      hasModules: ${{ steps.get-module-matrix.outputs.hasModules }}
      includeAllVersionedModules: ${{ steps.get-module-matrix.outputs.includeAllVersionedModules }}
      moduleMatrix: ${{ steps.get-module-matrix.outputs.moduleMatrix }}
      targetCommit: ${{ steps.get-module-matrix.outputs.targetCommit }}
      workflowInput: ${{ steps.get-module-matrix.outputs.workflowInput }}

  call_module_preview:
    name: "Check [${{ matrix.modulePath }}]"
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    permissions:
      contents: read
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-preview.yml@053d362184ace786c8c2977b673f3085a5203ddd
    with:
      tools-ref: 053d362184ace786c8c2977b673f3085a5203ddd
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      includeAllVersionedModules: ${{ needs.job_initialize_pipeline.outputs.includeAllVersionedModules == 'true' }}
    secrets: inherit

  call_module_fork_static:
    name: "Static check [${{ matrix.modulePath }}] (fork)"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    permissions:
      contents: read
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-static.yml@053d362184ace786c8c2977b673f3085a5203ddd
    with:
      tools-ref: 053d362184ace786c8c2977b673f3085a5203ddd
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      modulePath: "${{ matrix.modulePath }}"

  call_module_publish:
    name: "Check and publish [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    permissions:
      contents: write
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-publish.yml@053d362184ace786c8c2977b673f3085a5203ddd
    with:
      tools-ref: 053d362184ace786c8c2977b673f3085a5203ddd
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      publishReleaseTag: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit

  call_module_publish_only:
    name: "Publish [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    permissions:
      contents: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-publish-only.yml@053d362184ace786c8c2977b673f3085a5203ddd
    with:
      tools-ref: 053d362184ace786c8c2977b673f3085a5203ddd
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      modulePath: "${{ matrix.modulePath }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit
