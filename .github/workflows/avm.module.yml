name: ".Module - Check and Publish [EXPERIMENTAL]"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      staticValidation:
        type: boolean
        description: "Execute static validation"
        required: false
        default: true
      deploymentValidation:
        type: boolean
        description: "Execute deployment validation"
        required: false
        default: true
      removeDeployment:
        type: boolean
        description: "Remove deployed module"
        required: false
        default: true
      customLocation:
        type: string
        description: "Default location overwrite (e.g., eastus)"
        required: false
      createReleaseTag:
        type: boolean
        description: "Create the next top-level module release tag when no publishable diff exists"
        required: false
        default: false
      publishOnly:
        type: boolean
        description: "Skip validation and run only the publish step"
        required: false
        default: false
  pull_request:
    types:
      - labeled
      - synchronize
  push:
    branches:
      - main
    paths:
      - "avm/**"
      - "!avm/**/README.md"
      - "!avm/**/metadata.json"

permissions: {}

jobs:
  job_initialize_pipeline:
    runs-on: ubuntu-latest
    name: "Initialize pipeline"
    permissions:
      contents: read
    if: |
      !cancelled() &&
      !(github.repository != 'Azure/bicep-registry-modules' && github.event_name != 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'PR: Run Checks') &&
        (github.event.action != 'labeled' ||
          github.event.label.name == 'PR: Run Checks' ||
          github.event.label.name == 'PR: Run E2E Tests')
      ))
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - name: "Get module matrix"
        id: get-module-matrix
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-workflow-matrix@2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
        with:
          avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
          baseCommit: "${{ github.event.before }}"
          targetCommit: "${{ github.sha }}"
          pullRequestHeadCommit: "${{ github.event.pull_request.head.sha }}"
          eventName: "${{ github.event_name }}"
          modulePaths: "${{ inputs.modulePaths }}"
          createReleaseTag: "${{ inputs.createReleaseTag }}"
          publishOnly: "${{ inputs.publishOnly }}"
          customLocation: "${{ inputs.customLocation }}"
          staticValidation: "${{ case(github.event_name == 'workflow_dispatch', inputs.staticValidation, true) }}"
          deploymentValidation: "${{ case(github.event_name == 'workflow_dispatch', inputs.deploymentValidation, github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'PR: Run Checks') && contains(github.event.pull_request.labels.*.name, 'PR: Run E2E Tests'))) }}"
          removeDeployment: "${{ case(github.event_name == 'workflow_dispatch', inputs.removeDeployment, true) }}"
      - name: "Partition selected module routes"
        id: partition-module-matrix
        shell: pwsh
        env:
          MODULE_MATRIX: ${{ steps.get-module-matrix.outputs.moduleMatrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionTag.ps1')

          $matrix = ConvertFrom-Json -InputObject $env:MODULE_MATRIX -AsHashtable -NoEnumerate -Depth 100
          if ($matrix -isnot [System.Collections.IDictionary] -or $matrix.psbase.Count -ne 1 -or
              $matrix.psbase.Keys -cnotcontains 'include' -or $matrix['include'] -isnot [array]) {
            throw 'The selected module matrix must contain exactly one include array.'
          }
          $shared = [System.Collections.Generic.List[object]]::new()
          $local = [System.Collections.Generic.List[object]]::new()
          foreach ($entry in $matrix['include']) {
            if ($entry -isnot [System.Collections.IDictionary] -or
                $entry.psbase.Keys -cnotcontains 'modulePath' -or $entry['modulePath'] -isnot [string]) {
              throw 'Each selected module matrix entry must contain a modulePath string.'
            }
            $tag = Get-TestSubscriptionTag -ModulePath $entry['modulePath'] -RepoRootPath $env:GITHUB_WORKSPACE
            if ($tag -ceq 'General') {
              $shared.Add($entry)
            } else {
              $local.Add($entry)
            }
          }
          $outputs = [ordered]@{
            sharedModuleMatrix = ConvertTo-Json -InputObject @{ include = $shared.ToArray() } -Depth 100 -Compress -WarningAction Stop
            localModuleMatrix = ConvertTo-Json -InputObject @{ include = $local.ToArray() } -Depth 100 -Compress -WarningAction Stop
            hasSharedModules = ($shared.Count -gt 0).ToString().ToLowerInvariant()
            hasLocalModules = ($local.Count -gt 0).ToString().ToLowerInvariant()
          }
          foreach ($output in $outputs.GetEnumerator()) {
            "$($output.Key)=$($output.Value)" >> $env:GITHUB_OUTPUT
          }
    outputs:
      baseCommit: ${{ steps.get-module-matrix.outputs.baseCommit }}
      hasModules: ${{ steps.get-module-matrix.outputs.hasModules }}
      includeAllVersionedModules: ${{ steps.get-module-matrix.outputs.includeAllVersionedModules }}
      moduleMatrix: ${{ steps.get-module-matrix.outputs.moduleMatrix }}
      targetCommit: ${{ steps.get-module-matrix.outputs.targetCommit }}
      workflowInput: ${{ steps.get-module-matrix.outputs.workflowInput }}
      sharedModuleMatrix: ${{ steps.partition-module-matrix.outputs.sharedModuleMatrix }}
      localModuleMatrix: ${{ steps.partition-module-matrix.outputs.localModuleMatrix }}
      hasSharedModules: ${{ steps.partition-module-matrix.outputs.hasSharedModules }}
      hasLocalModules: ${{ steps.partition-module-matrix.outputs.hasLocalModules }}

  call_module_preview:
    name: "Check [${{ matrix.modulePath }}]"
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && needs.job_initialize_pipeline.outputs.hasSharedModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasSharedModules == 'true', needs.job_initialize_pipeline.outputs.sharedModuleMatrix, '{"include":[]}')) }}
    permissions:
      contents: read
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-preview.yml@2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
    with:
      tools-ref: 2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      includeAllVersionedModules: ${{ needs.job_initialize_pipeline.outputs.includeAllVersionedModules == 'true' }}
    secrets: inherit

  call_module_preview_local:
    name: "Check [${{ matrix.modulePath }}] (local)"
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && needs.job_initialize_pipeline.outputs.hasLocalModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasLocalModules == 'true', needs.job_initialize_pipeline.outputs.localModuleMatrix, '{"include":[]}')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/avm.template.module.preview.yml
    with:
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      includeAllVersionedModules: ${{ needs.job_initialize_pipeline.outputs.includeAllVersionedModules == 'true' }}
    secrets: inherit

  call_module_fork_static:
    name: "Static check [${{ matrix.modulePath }}] (fork)"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    permissions:
      contents: read
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-static.yml@2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
    with:
      tools-ref: 2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      modulePath: "${{ matrix.modulePath }}"

  call_module_publish:
    name: "Check and publish [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasSharedModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasSharedModules == 'true', needs.job_initialize_pipeline.outputs.sharedModuleMatrix, '{"include":[]}')) }}
    permissions:
      contents: write
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-publish.yml@2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
    with:
      tools-ref: 2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      publishReleaseTag: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit

  call_module_publish_local:
    name: "Check and publish [${{ matrix.modulePath }}] (local)"
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasLocalModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasLocalModules == 'true', needs.job_initialize_pipeline.outputs.localModuleMatrix, '{"include":[]}')) }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/avm.template.module.publish.yml
    with:
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      publishReleaseTag: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit

  call_module_publish_only:
    name: "Publish [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    permissions:
      contents: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-publish-only.yml@2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
    with:
      tools-ref: 2d7a09711b5ddbaf16da2f1c51ee80aeef5606f5
      avm-authoring-version: ${{ vars.AVM_AUTHORING_VERSION }}
      modulePath: "${{ matrix.modulePath }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit
