name: ".Module - Check and Publish"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      staticValidation:
        type: boolean
        description: "Execute static validation"
        required: false
        default: true
      deploymentValidation:
        type: boolean
        description: "Execute deployment validation"
        required: false
        default: true
      removeDeployment:
        type: boolean
        description: "Remove deployed module"
        required: false
        default: true
      customLocation:
        type: string
        description: "Default location overwrite (e.g., eastus)"
        required: false
      createReleaseTag:
        type: boolean
        description: "Create the next top-level module release tag when no publishable diff exists"
        required: false
        default: false
      publishOnly:
        type: boolean
        description: "Skip validation and run only the publish step"
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "avm/**"
      - "!avm/**/README.md"

permissions: {}

jobs:
  job_initialize_pipeline:
    runs-on: ubuntu-latest
    name: "Initialize pipeline"
    permissions:
      contents: read
    if: ${{ !cancelled() && !(github.repository != 'Azure/bicep-registry-modules' && github.event_name != 'workflow_dispatch') }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Get module matrix"
        id: get-module-matrix
        shell: pwsh
        env:
          BASE_SHA: "${{ github.event.before }}"
          CREATE_RELEASE_TAG: "${{ inputs.createReleaseTag }}"
          CUSTOM_LOCATION: "${{ inputs.customLocation }}"
          DEPLOYMENT_VALIDATION: "${{ case(github.event_name == 'workflow_dispatch', inputs.deploymentValidation, true) }}"
          EVENT_NAME: "${{ github.event_name }}"
          HEAD_SHA: "${{ github.sha }}"
          MODULE_PATH_INPUT: "${{ inputs.modulePaths }}"
          PUBLISH_ONLY: "${{ inputs.publishOnly }}"
          REMOVE_DEPLOYMENT: "${{ case(github.event_name == 'workflow_dispatch', inputs.removeDeployment, true) }}"
          STATIC_VALIDATION: "${{ case(github.event_name == 'workflow_dispatch', inputs.staticValidation, true) }}"
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-ModuleWorkflowMatrix.ps1')

          if (
            $env:EVENT_NAME -eq 'workflow_dispatch' -and
            $env:CREATE_RELEASE_TAG -eq 'true' -and
            $env:PUBLISH_ONLY -ne 'true' -and
            ($env:STATIC_VALIDATION -ne 'true' -or $env:DEPLOYMENT_VALIDATION -ne 'true')
          ) {
            throw 'createReleaseTag requires staticValidation and deploymentValidation unless publishOnly is selected.'
          }
          if (
            $env:EVENT_NAME -eq 'workflow_dispatch' -and
            $env:PUBLISH_ONLY -eq 'true' -and
            $env:CREATE_RELEASE_TAG -ne 'true'
          ) {
            throw 'publishOnly requires createReleaseTag so release tag creation is explicitly approved.'
          }

          $baseCommit = ''
          $includeAllVersionedModules = $false
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $moduleMatrix = Get-ModuleWorkflowMatrix -ModulePathInput $env:MODULE_PATH_INPUT -RepoRoot $env:GITHUB_WORKSPACE
          } else {
            $baseCommit = $env:BASE_SHA
            $baseCommitAvailable = $baseCommit -notmatch '^0+$'
            if ($baseCommitAvailable) {
              git cat-file -e "${baseCommit}^{commit}" 2>$null
              $baseCommitAvailable = $LASTEXITCODE -eq 0
            }
            if (-not $baseCommitAvailable -and $baseCommit -notmatch '^0+$') {
              git fetch --no-tags origin $baseCommit 2>$null
              if ($LASTEXITCODE -eq 0) {
                git cat-file -e "${baseCommit}^{commit}" 2>$null
                $baseCommitAvailable = $LASTEXITCODE -eq 0
              }
            }

            if ($baseCommitAvailable) {
              $changedFilePaths = @(git diff --no-renames --name-only --diff-filter=ACMRTD $baseCommit $env:HEAD_SHA -- avm)
            } else {
              Write-Warning 'The push base commit is unavailable. Running every current AVM module and previewing all versioned modules.'
              $changedFilePaths = @(git ls-tree -r --name-only $env:HEAD_SHA -- avm)
              $baseCommit = ''
              $includeAllVersionedModules = $true
            }
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to identify changed module files.'
            }

            $moduleMatrix = Get-ModuleWorkflowMatrix -ChangedFilePath $changedFilePaths -RepoRoot $env:GITHUB_WORKSPACE
          }

          if ($moduleMatrix.include.Count -gt 256) {
            throw "The workflow resolved [$($moduleMatrix.include.Count)] modules, exceeding the 256-job matrix limit. Run the workflow manually with smaller module path batches."
          }

          $deploymentValidation = $includeAllVersionedModules ? 'false' : $env:DEPLOYMENT_VALIDATION.ToLowerInvariant()
          $workflowInput = @{
            customLocation       = $env:CUSTOM_LOCATION
            deploymentValidation = $deploymentValidation
            removeDeployment     = $env:REMOVE_DEPLOYMENT.ToLowerInvariant()
            staticValidation     = $env:STATIC_VALIDATION.ToLowerInvariant()
          } | ConvertTo-Json -Compress
          $moduleMatrixJson = $moduleMatrix | ConvertTo-Json -Depth 10 -Compress
          $hasModules = $moduleMatrix.include.Count -gt 0
          if (-not $hasModules) {
            Write-Output 'No AVM modules were affected. Nothing will be validated or published.'
          }

          Write-Output "baseCommit=$baseCommit" >> $env:GITHUB_OUTPUT
          Write-Output "hasModules=$($hasModules.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output "includeAllVersionedModules=$($includeAllVersionedModules.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output "moduleMatrix=$moduleMatrixJson" >> $env:GITHUB_OUTPUT
          Write-Output "targetCommit=$($env:HEAD_SHA)" >> $env:GITHUB_OUTPUT
          Write-Output "workflowInput=$workflowInput" >> $env:GITHUB_OUTPUT
    outputs:
      baseCommit: ${{ steps.get-module-matrix.outputs.baseCommit }}
      hasModules: ${{ steps.get-module-matrix.outputs.hasModules }}
      includeAllVersionedModules: ${{ steps.get-module-matrix.outputs.includeAllVersionedModules }}
      moduleMatrix: ${{ steps.get-module-matrix.outputs.moduleMatrix }}
      targetCommit: ${{ steps.get-module-matrix.outputs.targetCommit }}
      workflowInput: ${{ steps.get-module-matrix.outputs.workflowInput }}

  call_module_preview:
    name: "Check [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'push' && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    concurrency:
      group: generic-module-${{ matrix.modulePath }}
      queue: max
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/avm.template.module.preview.yml
    with:
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      includeAllVersionedModules: ${{ needs.job_initialize_pipeline.outputs.includeAllVersionedModules == 'true' }}
    secrets: inherit

  call_module_publish:
    name: "Check and publish [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    concurrency:
      group: generic-module-${{ matrix.modulePath }}
      queue: max
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/avm.template.module.publish.yml
    with:
      workflowInput: "${{ needs.job_initialize_pipeline.outputs.workflowInput }}"
      modulePath: "${{ matrix.modulePath }}"
      moduleTestFilePaths: "${{ matrix.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ matrix.psRuleModuleTestFilePaths }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      publishReleaseTag: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit

  call_module_publish_only:
    name: "Publish [${{ matrix.modulePath }}]"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publishOnly && needs.job_initialize_pipeline.outputs.hasModules == 'true' }}
    needs:
      - job_initialize_pipeline
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(case(needs.job_initialize_pipeline.outputs.hasModules == 'true', needs.job_initialize_pipeline.outputs.moduleMatrix, '{"include":[]}')) }}
    concurrency:
      group: generic-module-${{ matrix.modulePath }}
      queue: max
    permissions:
      contents: write
    uses: ./.github/workflows/avm.template.module.publish-only.yml
    with:
      modulePath: "${{ matrix.modulePath }}"
      baseCommit: "${{ needs.job_initialize_pipeline.outputs.baseCommit }}"
      targetCommit: "${{ needs.job_initialize_pipeline.outputs.targetCommit }}"
      forcePublish: ${{ inputs.createReleaseTag }}
      requirePublishApproval: ${{ inputs.createReleaseTag }}
    secrets: inherit
