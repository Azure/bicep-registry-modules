name: "avm.template.module-entry"

on:
  workflow_call:
    inputs:
      workflowInput:
        type: string
        description: "Input from the workflow caller in JSON format"
        required: true
      modulePath:
        type: string
        description: "Relative path to the module folder"
        required: true
      forcePublish:
        type: boolean
        description: "Create a release tag when no publishable diff exists"
        required: false
        default: false
      publishMode:
        type: string
        description: "Release tag behavior: publish or preview"
        required: false
        default: "publish"
      publishOnly:
        type: boolean
        description: "Skip validation and run only the publish step"
        required: false
        default: false
      requirePublishApproval:
        type: boolean
        description: "Require approval before publishing a release tag"
        required: false
        default: false

permissions: {}

jobs:
  job_initialize_pipeline:
    if: ${{ !inputs.publishOnly }}
    runs-on: ubuntu-latest
    name: "Initialize module"
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Get module test file paths"
        id: get-module-test-file-paths
        uses: ./.github/actions/templates/avm-getModuleTestFiles
        with:
          modulePath: "${{ inputs.modulePath }}"
    outputs:
      moduleTestFilePaths: ${{ steps.get-module-test-file-paths.outputs.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ steps.get-module-test-file-paths.outputs.psRuleModuleTestFilePaths }}

  call_module_workflow_preview:
    name: "Preview"
    if: ${{ !inputs.publishOnly && inputs.publishMode == 'preview' }}
    permissions:
      id-token: write
      contents: read
    needs:
      - job_initialize_pipeline
    uses: ./.github/workflows/avm.template.module.yml
    with:
      workflowInput: "${{ inputs.workflowInput }}"
      moduleTestFilePaths: "${{ needs.job_initialize_pipeline.outputs.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ needs.job_initialize_pipeline.outputs.psRuleModuleTestFilePaths }}"
      modulePath: "${{ inputs.modulePath }}"
      forcePublish: ${{ inputs.forcePublish }}
      publishMode: "preview"
      publishOnly: false
      requirePublishApproval: false
    secrets: inherit

  call_module_workflow:
    name: "Run"
    if: ${{ !inputs.publishOnly && inputs.publishMode == 'publish' }}
    permissions:
      id-token: write
      contents: write
    needs:
      - job_initialize_pipeline
    uses: ./.github/workflows/avm.template.module.yml
    with:
      workflowInput: "${{ inputs.workflowInput }}"
      moduleTestFilePaths: "${{ needs.job_initialize_pipeline.outputs.moduleTestFilePaths }}"
      psRuleModuleTestFilePaths: "${{ needs.job_initialize_pipeline.outputs.psRuleModuleTestFilePaths }}"
      modulePath: "${{ inputs.modulePath }}"
      forcePublish: ${{ inputs.forcePublish }}
      publishMode: "publish"
      publishOnly: false
      requirePublishApproval: ${{ inputs.requirePublishApproval }}
    secrets: inherit

  call_publish_only_workflow:
    name: "Publish only"
    if: ${{ inputs.publishOnly }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/avm.template.module.yml
    with:
      workflowInput: "${{ inputs.workflowInput }}"
      moduleTestFilePaths: "[]"
      psRuleModuleTestFilePaths: "[]"
      modulePath: "${{ inputs.modulePath }}"
      forcePublish: ${{ inputs.forcePublish }}
      publishMode: "${{ inputs.publishMode }}"
      publishOnly: true
      requirePublishApproval: ${{ inputs.requirePublishApproval }}
    secrets: inherit
