name: ".Platform - Observe E2E PR labels"

on:
  pull_request:
    types:
      - labeled
      - unlabeled

permissions: {}

jobs:
  observe-labels:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: Azure/azure-verified-modules-tools/.github/workflows/pr-check-label-observer.yml@4ba5ab579d2a5074236aec42bfd831102fb70ca7
