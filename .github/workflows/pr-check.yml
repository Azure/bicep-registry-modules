name: ".Module - PR Check"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      authoringSource:
        type: choice
        description: "Where to obtain the Avm.Authoring PowerShell module."
        required: true
        default: gallery
        options:
          - gallery
          - repo
      authoringRef:
        type: string
        description: "Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag)."
        required: false
      runE2E:
        type: boolean
        description: "Run Azure deployment tests in addition to PR checks and unit tests."
        default: false
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions: {}

jobs:
  initialize:
    name: "Initialize module checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasModules: ${{ steps.initialize.outputs.hasModules }}
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
      targetCommit: ${{ steps.initialize.outputs.targetCommit }}
      workflowInput: ${{ steps.initialize.outputs.workflowInput }}
      authoringArtifact: ${{ steps.initialize.outputs.authoringArtifact }}
    steps:
      - name: "Check out repository for change detection"
        if: >-
          github.event_name == 'pull_request' &&
          github.repository == 'Azure/bicep-registry-modules' &&
          (github.event.action != 'labeled' || github.event.label.name == 'PR: Run E2E Tests')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: /.github/workflows/pr-check.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: "Check for module changes"
        id: changes
        if: >-
          github.event_name == 'pull_request' &&
          github.repository == 'Azure/bicep-registry-modules' &&
          (github.event.action != 'labeled' || github.event.label.name == 'PR: Run E2E Tests')
        shell: pwsh
        env:
          TARGET_COMMIT: ${{ github.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TARGET_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:HEAD_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The pull request merge and head must be full commit SHAs.'
          }
          $history = @(git rev-list --parents -n 1 $env:TARGET_COMMIT --)
          if ($LASTEXITCODE -ne 0 -or $history.Count -ne 1) {
            throw 'The pull request merge commit is unavailable.'
          }
          $parents = @($history[0] -split ' ')
          if ($parents.Count -ne 3 -or $parents[0] -cne $env:TARGET_COMMIT -or
              $parents[1] -cnotmatch '^[0-9a-f]{40}$' -or $parents[2] -cne $env:HEAD_COMMIT) {
            throw 'The pull request merge commit does not match the pull request head.'
          }
          git diff --quiet --no-renames $parents[1] $env:TARGET_COMMIT -- avm
          if ($LASTEXITCODE -notin @(0, 1)) {
            throw "Module change detection failed with exit code $LASTEXITCODE."
          }
          "hasModules=$(($LASTEXITCODE -eq 1).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: "Prepare module checks"
        id: initialize
        if: steps.changes.outputs.hasModules != 'false'
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-pr-check-initializer@987bf24c2d2f22cd063444b86fad80aeb0e9b748
        with:
          authoringSource: ${{ inputs.authoringSource || 'gallery' }}
          authoringRef: ${{ inputs.authoringRef || '' }}
          modulePaths: ${{ inputs.modulePaths || '' }}
          deploymentValidation: ${{ inputs.runE2E && 'true' || 'false' }}

  check:
    name: "${{ matrix.modulePath }}"
    needs: initialize
    if: needs.initialize.outputs.hasModules == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-runtime.yml@987bf24c2d2f22cd063444b86fad80aeb0e9b748
    with:
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.initialize.outputs.authoringArtifact }}
    secrets: inherit
