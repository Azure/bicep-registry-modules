name: ".Module - PR Check"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      authoringSource:
        type: choice
        description: "Where to obtain the Avm.Authoring PowerShell module."
        required: true
        default: gallery
        options:
          - gallery
          - repo
      authoringRef:
        type: string
        description: "Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag)."
        required: false
      runE2E:
        type: boolean
        description: "Run required and optional Azure deployment tests."
        default: false
      keepResources:
        type: boolean
        description: "Retain Azure E2E resources after testing when runE2E is enabled."
        default: false
      retrieveOnly:
        type: boolean
        description: "Retrieve the observed failed registry task log without running tests."
        default: false
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions: {}

jobs:
  initialize:
    name: "Initialize module checks"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retrieveOnly) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasModules: ${{ steps.initialize.outputs.hasModules }}
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
      targetCommit: ${{ steps.initialize.outputs.targetCommit }}
      workflowInput: ${{ steps.initialize.outputs.workflowInput }}
      authoringArtifact: ${{ steps.initialize.outputs.authoringArtifact }}
      hasRequiredModules: ${{ steps.initialize.outputs.hasRequiredModules }}
      requiredRequested: ${{ steps.initialize.outputs.requiredRequested }}
      requiredErrors: ${{ steps.initialize.outputs.requiredErrors }}
      hasOptionalModules: ${{ steps.initialize.outputs.hasOptionalModules }}
      optionalRequested: ${{ steps.initialize.outputs.optionalRequested }}
    steps:
      - name: "Prepare module checks"
        id: initialize
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-pr-check-initializer@b00ead1f3581363b2a1c24fa07f4b66ea6495aee
        with:
          authoringSource: ${{ inputs.authoringSource || 'gallery' }}
          authoringRef: ${{ inputs.authoringRef || '' }}
          modulePaths: ${{ inputs.modulePaths || '' }}
          deploymentValidation: ${{ inputs.runE2E && 'true' || 'false' }}
          keepResources: ${{ github.event_name == 'workflow_dispatch' && inputs.runE2E && inputs.keepResources && 'true' || 'false' }}

  check:
    name: "Module checks: ${{ matrix.modulePath }}"
    needs: initialize
    if: needs.initialize.outputs.hasModules == 'true' && !(github.event_name == 'workflow_dispatch' && github.event.repository.fork)
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: ./.github/workflows/bicep-module-runtime.yml
    with:
      tools-ref: b00ead1f3581363b2a1c24fa07f4b66ea6495aee
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.initialize.outputs.authoringArtifact }}
    secrets: inherit

  check-fork:
    name: "Fork module checks: ${{ matrix.modulePath }}"
    needs: initialize
    if: needs.initialize.outputs.hasModules == 'true' && github.event_name == 'workflow_dispatch' && github.event.repository.fork
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: ./.github/workflows/bicep-module-runtime.yml
    with:
      tools-ref: b00ead1f3581363b2a1c24fa07f4b66ea6495aee
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.initialize.outputs.authoringArtifact }}
    secrets:
      ARM_CLIENT_ID_OVERRIDE: ${{ secrets.ARM_CLIENT_ID_OVERRIDE }}
      ARM_TENANT_ID_OVERRIDE: ${{ secrets.ARM_TENANT_ID_OVERRIDE }}
      ARM_SUBSCRIPTION_ID_OVERRIDE: ${{ secrets.ARM_SUBSCRIPTION_ID_OVERRIDE }}
      VALIDATE_SUBSCRIPTION_IDS: ${{ secrets.VALIDATE_SUBSCRIPTION_IDS }}
      TEST_SUBSCRIPTION_IDS: ${{ secrets.TEST_SUBSCRIPTION_IDS }}
      VALIDATE_SUBSCRIPTION_ID: ${{ secrets.VALIDATE_SUBSCRIPTION_ID }}
      VALIDATE_TENANT_ID: ${{ secrets.VALIDATE_TENANT_ID }}
      VALIDATE_MANAGEMENT_GROUP_ID: ${{ secrets.VALIDATE_MANAGEMENT_GROUP_ID }}
      ARM_MGMTGROUP_ID: ${{ secrets.ARM_MGMTGROUP_ID }}
      TOKEN_NAMEPREFIX: ${{ secrets.TOKEN_NAMEPREFIX }}

  module-gate:
    name: "Report check status"
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.retrieveOnly) }}
    needs: [initialize, check, check-fork]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: "Evaluate and report check status"
        uses: Azure/azure-verified-modules-tools/.github/actions/report-check-status@b00ead1f3581363b2a1c24fa07f4b66ea6495aee
        with:
          ecosystem: bicep
          results: ${{ toJSON(needs) }}
          require-e2e: ${{ github.event_name == 'pull_request' || inputs.runE2E }}

  retrieve-diagnostic-log:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.retrieveOnly && !inputs.runE2E && !inputs.keepResources }}
    name: "Retrieve observed test log"
    environment: avm-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out diagnostic scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify the observed test pool and registry
        id: guard
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          MODULE_CLIENT_IDS: ${{ vars.VALIDATE_MODULE_CLIENT_IDS }}
        run: ./.github/diagnostic/verify-registry.ps1
      - name: Sign in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ steps.guard.outputs.clientId }}
          tenant-id: ${{ vars.VALIDATE_TENANT_ID || secrets.VALIDATE_TENANT_ID }}
          subscription-id: ${{ steps.guard.outputs.subscriptionId }}
      - name: Encrypt the failed task log
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ steps.guard.outputs.subscriptionId }}
          RESOURCE_GROUP: ${{ steps.guard.outputs.resourceGroup }}
          REGISTRY_NAME: ${{ steps.guard.outputs.registryName }}
          DIAGNOSTIC_CERT: ${{ github.workspace }}/.github/diagnostic/recipient.pem
        run: ./.github/diagnostic/retrieve-encrypted-logs.ps1
      - name: Upload encrypted log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-required-aca-task-log
          path: ${{ runner.temp }}/encrypted-service-logs/*.p7m
          if-no-files-found: error
          retention-days: 7
