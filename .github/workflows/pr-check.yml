name: ".Module - PR Check"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      authoringSource:
        type: choice
        description: "Where to obtain the Avm.Authoring PowerShell module."
        required: true
        default: gallery
        options:
          - gallery
          - repo
      authoringRef:
        type: string
        description: "Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag)."
        required: false
      runE2E:
        type: boolean
        description: "Run required and optional Azure deployment tests."
        default: false
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled

permissions: {}

jobs:
  initialize:
    name: "Initialize module checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasModules: ${{ steps.initialize.outputs.hasModules }}
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
      targetCommit: ${{ steps.initialize.outputs.targetCommit }}
      workflowInput: ${{ steps.initialize.outputs.workflowInput }}
      authoringArtifact: ${{ steps.initialize.outputs.authoringArtifact }}
      hasRequiredModules: ${{ steps.initialize.outputs.hasRequiredModules }}
      requiredRequested: ${{ steps.initialize.outputs.requiredRequested }}
      requiredErrors: ${{ steps.initialize.outputs.requiredErrors }}
    steps:
      - name: "Prepare module checks"
        id: initialize
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-pr-check-initializer@a2bf8d511cb55810d49ceaf2222dec8bfe2cd275
        with:
          authoringSource: ${{ inputs.authoringSource || 'gallery' }}
          authoringRef: ${{ inputs.authoringRef || '' }}
          modulePaths: ${{ inputs.modulePaths || '' }}
          deploymentValidation: ${{ inputs.runE2E && 'true' || 'false' }}

  check:
    name: "Module checks: ${{ matrix.modulePath }}"
    needs: initialize
    if: needs.initialize.outputs.hasModules == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-runtime.yml@a2bf8d511cb55810d49ceaf2222dec8bfe2cd275
    with:
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.initialize.outputs.authoringArtifact }}
    secrets: inherit

  module-gate:
    name: "Report check status"
    if: always()
    needs: [initialize, check]
    runs-on: ubuntu-latest
    env:
      INITIALIZE_RESULT: ${{ needs.initialize.result }}
      HAS_MODULES: ${{ needs.initialize.outputs.hasModules }}
      REQUIRE_E2E: ${{ github.event_name == 'pull_request' || inputs.runE2E }}
      HAS_REQUIRED_MODULES: ${{ needs.initialize.outputs.hasRequiredModules }}
      REQUIRED_REQUESTED: ${{ needs.initialize.outputs.requiredRequested }}
      REQUIRED_ERRORS: ${{ needs.initialize.outputs.requiredErrors }}
      CHECK_RESULT: ${{ needs.check.result }}
    steps:
      - name: Evaluate and report check status
        shell: pwsh
        run: |
          if ($env:INITIALIZE_RESULT -cne 'success') { throw 'Bicep initialization did not succeed.' }
          if ($env:HAS_MODULES -cnotin @('true', 'false')) { throw 'Bicep module selection is invalid.' }
          if ($env:REQUIRE_E2E -cnotin @('true', 'false')) { throw 'E2E enforcement selection is invalid.' }
          if ($env:REQUIRE_E2E -ceq 'true') {
            if ($env:HAS_REQUIRED_MODULES -cnotin @('true', 'false')) { throw 'Required E2E selection is invalid.' }
            if ($env:REQUIRED_REQUESTED -cnotin @('true', 'false')) { throw 'E2E request selection is invalid.' }
            if ($env:REQUIRED_ERRORS -cne '[]') { throw "Required E2E scenarios are ignored: $env:REQUIRED_ERRORS" }
            if ($env:HAS_REQUIRED_MODULES -ceq 'true' -and $env:REQUIRED_REQUESTED -cne 'true') {
              throw 'Add the PR: Run E2E Tests or PR: Run Optional E2E Tests label to run required E2E tests.'
            }
          }
          if ($env:HAS_MODULES -ceq 'true' -and $env:CHECK_RESULT -cne 'success') {
            throw 'Bicep module checks did not succeed (static, unit, or selected E2E tests).'
          }
