name: ".Module - PR Check [EXPERIMENTAL]"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      authoringSource:
        type: choice
        description: "Where to obtain the Avm.Authoring PowerShell module."
        required: true
        default: gallery
        options:
          - gallery
          - repo
      authoringRef:
        type: string
        description: "Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag)."
        required: false
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions: {}

jobs:
  pr-check:
    name: "Module checks [EXPERIMENTAL]"
    permissions:
      contents: read
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-pr-check.yml@8a0104ddc7be7bbef62317d28e427e6230903c40
    with:
      authoringSource: ${{ inputs.authoringSource || 'gallery' }}
      authoringRef: ${{ inputs.authoringRef || '' }}
    secrets: inherit
