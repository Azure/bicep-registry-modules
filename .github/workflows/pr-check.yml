name: ".Module - APIM portal-setting race experiment"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: apim-portal-setting-race-experiment
  cancel-in-progress: false

jobs:
  initialize:
    name: "Initialize module checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasModules: ${{ steps.initialize.outputs.hasModules }}
      moduleMatrix: ${{ steps.select.outputs.moduleMatrix }}
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
      targetCommit: ${{ steps.initialize.outputs.targetCommit }}
      workflowInput: ${{ steps.initialize.outputs.workflowInput }}
      authoringArtifact: ${{ steps.initialize.outputs.authoringArtifact }}
    steps:
      - name: "Prepare module checks"
        id: initialize
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-pr-check-initializer@8bca18987ce8853e844f4e95f8cc309162ee7b40
        with:
          authoringSource: gallery
          authoringRef: "0.44.0"
          modulePaths: avm/res/api-management/service
          deploymentValidation: "true"
      - name: Select only the max deployment without narrowing static checks
        id: select
        shell: pwsh
        env:
          MODULE_MATRIX: ${{ steps.initialize.outputs.moduleMatrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $matrix = ConvertFrom-Json -InputObject $env:MODULE_MATRIX -AsHashtable
          $entries = @($matrix.include)
          if ($entries.Count -ne 1 -or $entries[0].modulePath -cne 'avm/res/api-management/service' -or
              $entries[0].e2eRoute -cne 'native') {
            throw 'Expected exactly one native APIM module entry.'
          }
          $entry = $entries[0]
          $tests = @(ConvertFrom-Json -InputObject $entry.moduleTestFilePaths -AsHashtable)
          $max = @($tests | Where-Object { $_.path -ceq 'tests/e2e/max/main.test.bicep' })
          if ($max.Count -ne 1 -or $max[0].e2eIgnore) {
            throw 'Expected exactly one enabled APIM max deployment.'
          }
          $entry.moduleTestFilePaths = ConvertTo-Json -InputObject $max -Depth 20 -Compress
          $value = ConvertTo-Json -InputObject $matrix -Depth 20 -Compress
          "moduleMatrix=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  check:
    name: "${{ matrix.modulePath }}"
    needs: initialize
    if: needs.initialize.outputs.hasModules == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-runtime.yml@8bca18987ce8853e844f4e95f8cc309162ee7b40
    with:
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.initialize.outputs.authoringArtifact }}
    secrets: inherit
