name: ".Module - PR Check [EXPERIMENTAL]"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions: {}

jobs:
  pr-check:
    name: "Module checks [EXPERIMENTAL]"
    permissions:
      contents: read
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-pr-check.yml@d7639019598dda955ed55b614e7268f5d132d013
    secrets: inherit
