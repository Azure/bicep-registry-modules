name: ".Module - PR Check [EXPERIMENTAL]"

on:
  workflow_dispatch:
    inputs:
      modulePaths:
        type: string
        description: "Module path or comma-separated module paths"
        required: true
      authoringSource:
        type: choice
        description: "Where to obtain the Avm.Authoring PowerShell module."
        required: true
        default: gallery
        options:
          - gallery
          - repo
      authoringRef:
        type: string
        description: "Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag)."
        required: false
      runE2E:
        type: boolean
        description: "Run Azure deployment tests in addition to PR checks and unit tests."
        default: false
      readOnlyEvidence:
        type: boolean
        description: "Run only the separately reviewed retained TEST read-only diagnostic."
        default: false
      expectedCommit:
        type: string
        description: "Exact reviewed caller commit approved for the read-only diagnostic."
        required: false
      evidenceBundle:
        type: string
        description: "Base64 of the approved retained TEST scope bundle."
        required: false
      evidenceBundleSha256:
        type: string
        description: "Approved bundle SHA256, independently admitted by the tools workflow."
        required: false
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions: {}

jobs:
  initialize:
    name: "[AVM] Initialize module checks"
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.readOnlyEvidence }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasModules: ${{ steps.initialize.outputs.hasModules }}
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
      targetCommit: ${{ steps.initialize.outputs.targetCommit }}
      workflowInput: ${{ steps.initialize.outputs.workflowInput }}
      authoringArtifact: ${{ steps.initialize.outputs.authoringArtifact }}
    steps:
      - name: "[AVM] Prepare module checks"
        id: initialize
        uses: Azure/azure-verified-modules-tools/.github/actions/bicep-pr-check-initializer@ff00fff10582fc206757e3ea33647b6023a4e33e
        with:
          authoringSource: ${{ inputs.authoringSource || 'gallery' }}
          authoringRef: ${{ inputs.authoringRef || '' }}
          modulePaths: ${{ inputs.modulePaths || '' }}
          deploymentValidation: ${{ inputs.runE2E && 'true' || 'false' }}

  check:
    name: "[AVM] ${{ matrix.modulePath }}"
    needs: initialize
    if: needs.initialize.outputs.hasModules == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-module-runtime.yml@ff00fff10582fc206757e3ea33647b6023a4e33e
    with:
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.initialize.outputs.authoringArtifact }}
    secrets: inherit

  read-only-evidence:
    name: "[AVM] Retained TEST read-only evidence"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.readOnlyEvidence }}
    permissions:
      contents: read
      id-token: write
    uses: Azure/azure-verified-modules-tools/.github/workflows/bicep-retained-test-evidence.yml@51d107f63597f4f63bd3a7a8c247a8ee27b5a169
    with:
      tools-ref: 51d107f63597f4f63bd3a7a8c247a8ee27b5a169
      expectedCommit: ${{ inputs.expectedCommit }}
      evidenceBundle: ${{ inputs.evidenceBundle }}
      evidenceBundleSha256: ${{ inputs.evidenceBundleSha256 }}
      readOnlyEvidence: ${{ inputs.readOnlyEvidence }}
      runE2E: ${{ inputs.runE2E }}
    secrets:
      VALIDATE_TENANT_ID: ${{ secrets.VALIDATE_TENANT_ID }}
