name: "avm.template.module.preview"

on:
  workflow_call:
    inputs:
      workflowInput:
        type: string
        required: true
      moduleTestFilePaths:
        type: string
        required: true
      psRuleModuleTestFilePaths:
        type: string
        required: true
      modulePath:
        type: string
        required: true
      baseCommit:
        type: string
        required: false
      targetCommit:
        type: string
        required: true
      includeAllVersionedModules:
        type: boolean
        required: false
        default: false

env:
  ARM_MGMTGROUP_ID: "${{ secrets.ARM_MGMTGROUP_ID }}"
  TOKEN_NAMEPREFIX: "gci"
  CI_KEY_VAULT_NAME: "${{ vars.CI_KEY_VAULT_NAME }}"

permissions: {}

jobs:
  job_module_static_validation:
    name: "Static validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (fromJson(inputs.workflowInput)).staticValidation == 'true'
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Set environment"
        uses: ./.github/actions/templates/avm-setEnvironment
      - name: "Run tests"
        uses: ./.github/actions/templates/avm-validateModulePester
        with:
          modulePath: "${{ inputs.modulePath }}"

  job_psrule_must:
    name: "Must [${{ matrix.baseline.friendlyName }}] on [${{ matrix.testCases.name }}] - Required PSRule"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ inputs.psRuleModuleTestFilePaths != '[]' && (fromJson(inputs.workflowInput)).staticValidation == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        testCases: ${{ fromJson(inputs.psRuleModuleTestFilePaths) }}
        baseline:
          - friendlyName: Reliability
            baselineName: Azure.Pillar.Reliability
          - friendlyName: Custom Security
            baselineName: CB.AVM.WAF.Security
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: "Set environment"
        uses: ./.github/actions/templates/avm-setEnvironment
      - name: "Run Required PSRule validation with baseline [${{ matrix.baseline.friendlyName }}] on [${{ matrix.testCases.path }}]"
        uses: ./.github/actions/templates/avm-validateModulePSRule
        with:
          templateFilePath: "${{ inputs.modulePath }}/${{ matrix.testCases.path }}"
          managementGroupId: "${{ secrets.ARM_MGMTGROUP_ID }}"
          psrulePath: "/utilities/pipelines/staticValidation/psrule"
          psruleBaseline: ${{ matrix.baseline.baselineName }}
          softFailure: false

  job_psrule_opt:
    name: "Opt [${{ matrix.baseline.friendlyName }}] on [${{ matrix.testCases.name }}] - Optional PSRule"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ inputs.psRuleModuleTestFilePaths != '[]' && (fromJson(inputs.workflowInput)).staticValidation == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        testCases: ${{ fromJson(inputs.psRuleModuleTestFilePaths) }}
        baseline:
          - friendlyName: All pillars
            baselineName: Azure.Default
          - friendlyName: Security
            baselineName: Azure.Pillar.Security
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: "Set environment"
        uses: ./.github/actions/templates/avm-setEnvironment
      - name: "Run Optional PSRule validation with baseline [${{ matrix.baseline.friendlyName }}] on [${{ matrix.testCases.path }}]"
        uses: ./.github/actions/templates/avm-validateModulePSRule
        with:
          templateFilePath: "${{ inputs.modulePath }}/${{ matrix.testCases.path }}"
          managementGroupId: "${{ secrets.ARM_MGMTGROUP_ID }}"
          psrulePath: "/utilities/pipelines/staticValidation/psrule"
          psruleBaseline: ${{ matrix.baseline.baselineName }}
          softFailure: true

  job_module_deploy_validation:
    name: "Deploy [${{ matrix.testCases.name }}]"
    environment: avm-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      !cancelled() &&
      inputs.moduleTestFilePaths != '[]' &&
      (fromJson(inputs.workflowInput)).deploymentValidation == 'true' &&
      needs.job_module_static_validation.result != 'failure' &&
      needs.job_psrule_must.result != 'failure'
    needs:
      - job_module_static_validation
      - job_psrule_must
    strategy:
      fail-fast: false
      matrix:
        testCases: ${{ fromJson(inputs.moduleTestFilePaths) }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Set environment"
        uses: ./.github/actions/templates/avm-setEnvironment
        with:
          removeDeployment: "${{ fromJson(inputs.workflowInput).removeDeployment }}"
      - name: "Run deployment validation with test file [${{ matrix.testCases.path }}]"
        uses: ./.github/actions/templates/avm-validateModuleDeployment
        with:
          modulePath: "${{ inputs.modulePath }}"
          templateFilePath: "${{ inputs.modulePath }}/${{ matrix.testCases.path }}"
          deploymentMetadataLocation: "WestEurope"
          managementGroupId: "${{ secrets.ARM_MGMTGROUP_ID }}"
          removeDeployment: "${{ fromJson(inputs.workflowInput).removeDeployment }}"
          customLocation: "${{ fromJson(inputs.workflowInput).customLocation }}"
          e2eIgnore: "${{ matrix.testCases.e2eIgnore }}"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          VALIDATE_CLIENT_ID: ${{ secrets.VALIDATE_CLIENT_ID }}
          VALIDATE_SUBSCRIPTION_ID: ${{ secrets.VALIDATE_SUBSCRIPTION_ID }}
          VALIDATE_TENANT_ID: ${{ secrets.VALIDATE_TENANT_ID }}

  job_preview_module:
    name: "Publishing preview"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      !cancelled() &&
      needs.job_module_static_validation.result == 'success' &&
      (needs.job_module_deploy_validation.result == 'success' || (
        (inputs.includeAllVersionedModules || inputs.moduleTestFilePaths == '[]') &&
        needs.job_module_deploy_validation.result == 'skipped'
      )) &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Azure/bicep-registry-modules'
    needs:
      - job_module_static_validation
      - job_module_deploy_validation
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: "Preview module release tag"
        shell: pwsh
        env:
          BASE_COMMIT: "${{ inputs.baseCommit }}"
          INCLUDE_ALL_VERSIONED_MODULES: "${{ inputs.includeAllVersionedModules }}"
          MODULE_PATH: "${{ inputs.modulePath }}"
          TARGET_COMMIT: "${{ inputs.targetCommit }}"
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'publish' 'Set-ModuleWorkflowReleaseTag.ps1')

          $functionInput = @{
            TemplateFilePath           = Join-Path $env:GITHUB_WORKSPACE $env:MODULE_PATH 'main.bicep'
            RepoRoot                   = $env:GITHUB_WORKSPACE
            TargetCommit               = $env:TARGET_COMMIT
            IncludeAllVersionedModules = $env:INCLUDE_ALL_VERSIONED_MODULES -eq 'true'
            WhatIf                     = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BASE_COMMIT)) {
            $functionInput['BaseCommit'] = $env:BASE_COMMIT
          }

          $tagOutputs = Set-ModuleWorkflowReleaseTag @functionInput -Verbose
          $proposedTags = @(
            if ($tagOutputs) {
              $tagOutputs.GetEnumerator() | ForEach-Object {
                $_.Value.gitTagName ?? ('{0}/{1}' -f $_.Key, $_.Value.version)
              }
            }
          )

          if ($proposedTags.Count -eq 0) {
            Write-Output 'Release tag publishing is disabled. No release tags would be created.'
          } else {
            Write-Output 'Release tag publishing is disabled. The following tag(s) would be created or reused:'
            $proposedTags | ForEach-Object { Write-Output " - $_" }
          }
