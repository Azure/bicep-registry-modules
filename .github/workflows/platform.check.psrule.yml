name: .Platform - Check PSRule

on:
  workflow_dispatch:
    inputs:
      psruleBaseline:
        type: choice
        description: "PSRule baseline"
        required: true
        default: "Azure.Default"
        options:
          - Azure.Default
          - Azure.Pillar.CostOptimization
          - Azure.Pillar.OperationalExcellence
          - Azure.Pillar.PerformanceEfficiency
          - Azure.Pillar.Reliability
          - Azure.Pillar.Security
      skipPassedRulesReport:
        type: boolean
        description: "Show only failed rules in job summary"
        required: true
        default: true
  schedule:
    - cron: "0 12 * * 0" # Weekly Sunday Analysis

env:
  workflowPath: ".github/workflows/platform.check.psrule.yml"
  targetPath: "avm/"
  PSRuleOutputFilePath: "avm/PSRule-output.csv"
  PSRuleInputFilePath: "avm/PSRule-output.md"
  psRuleFilterRegex: "(defaults|waf-aligned)" # The regex used to filter PSRule compliant files
  psrulePath: "utilities/pipelines/staticValidation/psrule"
  ARM_MGMTGROUP_ID: "${{ vars.VALIDATE_MANAGEMENT_GROUP_ID || vars.ARM_MGMTGROUP_ID || secrets.VALIDATE_MANAGEMENT_GROUP_ID || secrets.ARM_MGMTGROUP_ID }}"
  TOKEN_NAMEPREFIX: "${{ secrets.TOKEN_NAMEPREFIX }}"

jobs:
  ###########################
  #   Initialize pipeline   #
  ###########################
  job_init_psrule_pipeline:
    runs-on: ubuntu-latest
    name: "Initialize pipeline"
    if: ${{ !cancelled() && !(github.repository != 'Azure/bicep-registry-modules' && github.event_name != 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Set input parameters to output variables
        id: get-workflow-param
        uses: ./.github/actions/templates/avm-getWorkflowInput
        with:
          workflowPath: "${{ env.workflowPath}}"
    outputs:
      workflowInput: ${{ steps.get-workflow-param.outputs.workflowInput }}

  ##############
  #   PSRule   #
  ##############
  job_psrule:
    environment: avm-validation
    runs-on: ubuntu-latest
    name: "PSRule validation"
    needs:
      - job_init_psrule_pipeline
    steps:
      # [Init] task(s)
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set environment
        uses: ./.github/actions/templates/avm-setEnvironment

      # [Token replacement] task(s)
      # ---------------------------
      - name: Replace tokens in relevant files
        uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2.0.0
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          VALIDATE_SUBSCRIPTION_ID: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
        with:
          azPSVersion: "latest"
          inlineScript: |
            $ErrorActionPreference = 'Stop'
            Write-Output '::group::Replace tokens in relevant files'

            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'tokenReplacement' 'Convert-TokensInFileList.ps1')
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-LocallyReferencedFileList.ps1')
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Get-TestSubscriptionList.ps1')

            $targetPath = Join-Path $env:GITHUB_WORKSPACE $env:targetPath
            Write-Verbose ('targetPath [{0}]' -f $targetPath) -Verbose

            $allTestFiles = (Get-ChildItem -Path $targetPath -Recurse -Filter 'main.test.bicep').FullName | Sort-Object
            $relevantTestFiles = $allTestFiles | Where-Object { $_ -match $env:psRuleFilterRegex }
            $baseTokens = @{
              subscriptionId    = $env:VALIDATE_SUBSCRIPTION_ID
              managementGroupId = $env:ARM_MGMTGROUP_ID
            }

            $tokenMap = @{}
            foreach ($token in (Get-ChildItem env: | Where-Object -Property Name -Like "localToken_*")) {
              $tokenMap += @{ $token.Name.Replace('localToken_','','OrdinalIgnoreCase') = $token.value }
            }
            Write-Verbose ('Using local tokens [{0}]' -f ($tokenMap.Keys -join ', ')) -Verbose
            $baseTokens += $tokenMap

            if ([string]::IsNullOrEmpty($baseTokens['namePrefix'])) {
              $baseTokens['namePrefix'] = $env:TOKEN_NAMEPREFIX
            }

            # Resolve every module before changing any test or shared dependency.
            $moduleTokens = @{}
            $fileInputs = @{}
            foreach ($relevantTestFile in $relevantTestFiles) {
              $relativeTestPath = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $relevantTestFile).Replace('\', '/')
              if ($relativeTestPath -cnotmatch '^(avm/(?:res|ptn|utl)/.+)/tests/e2e/.+/main\.test\.bicep$') {
                throw "Cannot determine the module root for PSRule test [$relativeTestPath]."
              }
              $modulePath = $Matches[1]
              if (-not $moduleTokens.ContainsKey($modulePath)) {
                $tokens = $baseTokens.Clone()
                if (-not [string]::IsNullOrEmpty($env:TEST_SUBSCRIPTION_IDS) -or
                    -not [string]::IsNullOrEmpty($env:VALIDATE_SUBSCRIPTION_ID)) {
                  $subscriptionInput = @{
                    TestSubscriptionIds    = $env:TEST_SUBSCRIPTION_IDS
                    FallbackSubscriptionId = $env:VALIDATE_SUBSCRIPTION_ID
                    ModulePath             = $modulePath
                    RepoRootPath           = $env:GITHUB_WORKSPACE
                  }
                  $tokens['subscriptionId'] = @(Get-TestSubscriptionList @subscriptionInput)[0].id
                }
                $moduleTokens[$modulePath] = $tokens
              }
              $tokens = $moduleTokens[$modulePath]
              $targetFileList = @($relevantTestFile) + @(Get-LocallyReferencedFileList -FilePath $relevantTestFile)
              foreach ($filePath in ($targetFileList | Sort-Object -Unique)) {
                if ($fileInputs.ContainsKey($filePath)) {
                  if ($fileInputs[$filePath].Tokens.subscriptionId -cne $tokens.subscriptionId -and
                      (Get-Content -LiteralPath $filePath -Raw) -match '#_subscriptionId_#') {
                    throw "Shared PSRule file [$filePath] requires conflicting module subscription tokens."
                  }
                } else {
                  $fileInputs[$filePath] = @{
                    FilePathList = @($filePath)
                    Tokens       = $tokens
                  }
                }
              }
            }

            foreach ($filePath in ($fileInputs.Keys | Sort-Object)) {
              $convertTokensInputs = $fileInputs[$filePath]
              if (-not (Convert-TokensInFileList @convertTokensInputs)) {
                throw "PSRule token replacement failed for [$filePath]."
              }
            }

            Write-Output '::endgroup::'

      # [PSRule validation] task(s)
      #-----------------------------
      - name: Prepare PSRule packages
        id: prepare_psrule
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'staticValidation' 'psrule' 'Initialize-PSRuleRepository.ps1')
          $repository = Initialize-PSRuleRepository -TemporaryPath $env:RUNNER_TEMP
          "repository=$repository" >> $env:GITHUB_OUTPUT

      - name: Run PSRule analysis
        if: ${{ steps.prepare_psrule.outcome == 'success' }}
        uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        with:
          repository: ${{ steps.prepare_psrule.outputs.repository }}
          modules: "PSRule.Rules.Azure"
          prerelease: true
          baseline: "${{(fromJson(needs.job_init_psrule_pipeline.outputs.workflowInput)).psruleBaseline }}"
          inputPath: "${{(fromJson(needs.job_init_psrule_pipeline.outputs.workflowInput)).targetPath }}"
          outputFormat: Csv
          outputPath: "${{ env.PSRuleOutputFilePath }}"
          option: "${{ github.workspace }}/${{ env.psrulePath}}/ps-rule.yaml" # Path to PSRule configuration options file
          source: "${{ env.psrulePath}}/.ps-rule/" # Path to folder containing suppression rules to use for analysis.
          summary: false # Disabling as taken care in customized task

      # [Print to Summary] task(s)
      #-----------------------------
      - name: Parse CSV content
        if: always()
        uses: azure/powershell@53dd145408794f7e80f97cfcca04155c85234709 # v2.0.0
        with:
          azPSVersion: "latest"
          inlineScript: |
            # Grouping task logs
            Write-Output '::group::Parse CSV content'

            # Load used functions
            . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'staticValidation' 'psrule' 'Set-PSRuleGitHubOutput.ps1')

            # Populate parameter input
            $ParameterInput = @{
              inputFilePath         = '${{ env.PSRuleOutputFilePath }}'
              outputFilePath        = '${{ env.PSRuleInputFilePath }}'
              skipPassedRulesReport = [System.Convert]::ToBoolean('${{(fromJson(needs.job_init_psrule_pipeline.outputs.workflowInput)).skipPassedRulesReport }}')
            }

            Write-Verbose ('Set PS Rule Output with following parameters:`n{0}' -f (ConvertTo-Json $ParameterInput -Depth 10)) -Verbose

            # Invoke Set PSRule Output Functionality
            $null = Set-PSRuleGitHubOutput @ParameterInput

            Write-Output '::endgroup::'

      - name: Output to GitHub job summaries
        if: always()
        shell: pwsh
        run: |
          # Grouping task logs
          Write-Output '::group::Output to GitHub job summaries'

          $mdPSRuleOutputFilePath = Join-Path $env:GITHUB_WORKSPACE '${{ env.PSRuleInputFilePath }}'

          if (-not (Test-Path $mdPSRuleOutputFilePath)) {
            Write-Warning ('Input file [{0}] not found. Please check if the previous task threw an error and try again.' -f $mdPSRuleOutputFilePath)
            return ''
          } else {
            Get-Content $mdPSRuleOutputFilePath >> $env:GITHUB_STEP_SUMMARY
            Write-Verbose ('Successfully printed out file [{0}] to Job Summaries' -f $mdPSRuleOutputFilePath) -Verbose
          }

          Write-Output '::endgroup::'
