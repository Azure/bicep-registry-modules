# Workflow for labelling PRs and requesting reviews from the owners declared in metadata.json
name: .Platform - Set AVM GitHub PR owner config

on:
  # Runs against the base branch so that pull requests from forks get the write token and app
  # credentials this workflow needs. The checkout below must never be pointed at the pull request
  # head, as that would execute untrusted code with those credentials.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  SetAvmGitHubPrLabels:
    name: Set-AvmGitHubPrLabels
    runs-on: ubuntu-latest
    if: github.repository == 'Azure/bicep-registry-modules'
    # Holds the Azure-Verified-Modules app credentials. Must not have deployment protection rules,
    # as those would stall every pull request waiting for an approval.
    environment: avm-management
    permissions:
      pull-requests: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
      - name: "Run scripts"
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Load used functions
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'platform' 'Set-AvmGitHubPrLabels.ps1')

          $functionInput = @{
            RepoRoot = $env:GITHUB_WORKSPACE
            Repo     = "${{ github.repository_owner }}/${{ github.event.repository.name }}"
            PrUrl = "${{ github.event.pull_request.url }}"
          }

          Write-Verbose "Invoke task with" -Verbose
          Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

          Set-AvmGitHubPrLabels @functionInput -Verbose # -WhatIf
