name: ".Platform - Rerun PR check after E2E label observation"

on:
  workflow_run:
    workflows:
      - ".Platform - Observe E2E PR labels"
    types:
      - completed

permissions: {}

jobs:
  rerun-pr-check:
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    uses: Azure/azure-verified-modules-tools/.github/workflows/pr-check-label-rerun.yml@4ba5ab579d2a5074236aec42bfd831102fb70ca7
    with:
      tools-ref: 4ba5ab579d2a5074236aec42bfd831102fb70ca7
      observer-workflow-path: ".github/workflows/platform.on-pull-request-observe-e2e-labels.yml"
