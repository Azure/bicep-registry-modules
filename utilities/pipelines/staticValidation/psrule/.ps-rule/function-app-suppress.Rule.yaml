---
# Synopsis: Flex Consumption scales dynamically; the instance-count rule does not recognize FC1.
# Upstream fix: https://github.com/Azure/PSRule.Rules.Azure/issues/3929
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: SuppressFunctionAppFlexInstanceCount
spec:
  rule:
    - Azure.AppService.PlanInstanceCount
  if:
    allOf:
      - source: Template
        withinPath:
          - avm/ptn/app/function-app/
      - type: "."
        equals: Microsoft.Web/serverfarms
      - field: sku.name
        equals: FC1
